name: Ktor Build, Docker, and Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - .github/workflows/build.yml
      - docker/**
      - server/**
      - proxy/**
      - common-rpc
      - common-proxy/**
      - Dockerfile.nobuild
      - build.gradle.kts
      - gradle.properties
      - settings.gradle.kts
    branches: [ master, release ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Tests and Generate Coverage
        run: ./gradlew test koverXmlReport koverHtmlReport

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/test-results/test*/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      - name: Add Coverage to Summary
        uses: madrapps/jacoco-report@v1.7.1
        if: always()
        with:
          paths: |
            ${{ github.workspace }}/**/build/reports/kover/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: Code Coverage Report
          update-comment: true
          comment-type: both

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            **/build/reports/kover/report.xml
            **/build/reports/kover/html/

  build-artifact:
    needs: run-tests
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version_info.outputs.APP_VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Ktor fat JARs
        run: ./gradlew :server:shadowJar :proxy:shadowJar

      - name: Extract Application Version
        id: version_info
        run: |
          VERSION=$(grep -E 'version[[:space:]]*=' build.gradle build.gradle.kts 2>/dev/null | head -n 1 | sed -E "s/.*=\s*[\"'\"']([^\"'\"']*)[\"'\"'].*/\1/")          
          if [ -z "$VERSION" ]; then
            echo "Error: Application version not found in build.gradle or build.gradle.kts."
            exit 1 
          fi
          
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted Version: $VERSION"

      - name: Upload Server fat JAR
        uses: actions/upload-artifact@v7
        with:
          name: server-fat-jar
          path: server/build/libs/server-all.jar
          retention-days: 1

      - name: Upload Proxy fat JAR
        uses: actions/upload-artifact@v7
        with:
          name: proxy-fat-jar
          path: proxy/build/libs/proxy-all.jar
          retention-days: 1

  build-publish-docker:
    needs: build-artifact
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            repo: "dertyp7214/synara"
            dockerfile: "./Dockerfile.nobuild"
            artifact: "server-fat-jar"
          - name: proxy
            repo: "dertyp7214/synara-proxy"
            dockerfile: "./Dockerfile.proxy"
            artifact: "proxy-fat-jar"
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download fat JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ./

      - name: Get current month
        id: date
        run: |
          echo "month_year=$(date +'%Y-%m')" >> $GITHUB_OUTPUT
          echo "day_month_year=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ matrix.repo }}
          tags: |
            type=raw,value=${{ needs.build-artifact.outputs.app_version }}${{ github.ref_name == 'master' && '-dev' || '' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}
            type=raw,value=latest-dev,enable=${{ github.ref_name == 'master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ matrix.repo }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ matrix.repo }}:buildcache,mode=max
          build-args: |
            MONTH_YEAR=${{ steps.date.outputs.month_year }}
            DAY_MONTH_YEAR=${{ steps.date.outputs.day_month_year }}

  create-github-release:
    needs: build-artifact
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download Server fat JAR
        uses: actions/download-artifact@v8
        with:
          name: server-fat-jar
          path: release-asset/

      - name: Download Proxy fat JAR
        uses: actions/download-artifact@v8
        with:
          name: proxy-fat-jar
          path: release-asset/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-artifact.outputs.app_version }}${{ github.ref_name == 'master' && '-dev' || '' }}-server
          name: Release v${{ needs.build-artifact.outputs.app_version }}${{ github.ref_name == 'master' && ' (Development Build)' || '' }}
          repository: DerTyp7214/synara
          prerelease: ${{ github.ref_name == 'master' }}
          target_commitish: server
          files: |
            release-asset/*.jar
          token: ${{ secrets.SYNARA_GITHUB_TOKEN }}

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest${{ github.ref_name == 'master' && '-dev' || '' }}-server
          name: Release v${{ needs.build-artifact.outputs.app_version }}${{ github.ref_name == 'master' && ' (Development Build)' || '' }}
          repository: DerTyp7214/synara
          prerelease: ${{ github.ref_name == 'master' }}
          target_commitish: server
          files: |
            release-asset/*.jar
          token: ${{ secrets.SYNARA_GITHUB_TOKEN }}
