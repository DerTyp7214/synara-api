services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_USER_ID: 1000
        APP_GROUP_ID: 1000
    user: "1000:1000"
    network_mode: host
    env_file:
      - .server.env
    environment:
      - PORT=8081
      - HOST_UID=1000
      - HOST_GID=1000
      - DB_URL=jdbc:postgresql://127.0.0.1:5432/synara-api-db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_DRIVER=org.postgresql.Driver
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
    volumes:
      - /home/typ/Music:/data
      - config:/home/appuser/.config
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres
    user: "1000:1000"
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: synara-api-db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s
    restart: unless-stopped
  redis-cache:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lfu
    restart: unless-stopped

volumes:
  config:
  postgres:
  redis_data: