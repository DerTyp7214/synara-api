<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synara migration timeline</title>
<style>
:root {
  color-scheme: light;
  --bg: #fafbfc; --raised: #ffffff; --ink: #14171c; --ink2: #4a515c; --muted: #6b727d;
  --grid: #e7eaee; --axis: #c5cad2; --border: rgba(20,23,28,.13); --wash: rgba(20,23,28,.05);
  --s0: #2a78d6; --s1: #eb6834; --s2: #1baf7a; --s3: #eda100; --s4: #e87ba4; --s5: #008300;
  --s6: #4a3aa7; --s7: #e34948; --other: #9aa1ab; --all: #3d4450;
  --shadow: 0 6px 24px rgba(20,23,28,.12), 0 1px 3px rgba(20,23,28,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14161a; --raised: #1f2228; --ink: #f3f5f7; --ink2: #b9c0ca; --muted: #8b929d;
    --grid: #262a31; --axis: #3d424b; --border: rgba(255,255,255,.14); --wash: rgba(255,255,255,.07);
    --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300;
    --s6: #9085e9; --s7: #e66767; --other: #5d646f; --all: #c9cfd8;
    --shadow: 0 8px 28px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161a; --raised: #1f2228; --ink: #f3f5f7; --ink2: #b9c0ca; --muted: #8b929d;
  --grid: #262a31; --axis: #3d424b; --border: rgba(255,255,255,.14); --wash: rgba(255,255,255,.07);
  --s0: #3987e5; --s1: #d95926; --s2: #199e70; --s3: #c98500; --s4: #d55181; --s5: #008300;
  --s6: #9085e9; --s7: #e66767; --other: #5d646f; --all: #c9cfd8;
  --shadow: 0 8px 28px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 28px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }

/* ---------- header ---------- */
.top { padding: 44px 0 14px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
h1 { margin: 0; font-size: clamp(30px, 5.4vw, 52px); line-height: 1.04; font-weight: 680; letter-spacing: -0.028em; }
#lede { margin: 12px 0 0; color: var(--ink2); font-size: 16px; max-width: 62ch; }
#theme {
  flex: none; margin-top: 8px; background: none; border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 13px; font-size: 13px; color: var(--ink2); white-space: nowrap;
}
#theme:hover { background: var(--wash); }

/* ---------- figures ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px 28px; padding: 26px 0 28px; border-top: 1px solid var(--grid); }
.stat .v { font-size: clamp(22px, 2.9vw, 31px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; white-space: nowrap; }
.stat .l { color: var(--ink2); font-size: 13.5px; margin-top: 5px; }
.stat .s { color: var(--muted); font-size: 12.5px; }

/* ---------- filter bar ---------- */
.filterbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--grid); border-top: 1px solid var(--grid); }
.filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button {
  display: inline-flex; align-items: center; gap: 7px; background: none;
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px 4px 10px; font-size: 13.5px; color: var(--ink2);
}
.chips button:hover { background: var(--wash); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.chips button .n { font-variant-numeric: tabular-nums; opacity: .7; font-weight: 400; font-size: 12.5px; }
.chips button[aria-pressed="true"] .dot { box-shadow: 0 0 0 1.5px var(--bg); }
.sep { width: 1px; align-self: stretch; background: var(--grid); }
#q { flex: 1 1 200px; min-width: 160px; background: var(--raised); border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 14px; font-size: 14px; }
#q::placeholder { color: var(--muted); }
#count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#order { background: none; border: 1px solid var(--border); border-radius: 7px; padding: 3px 10px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
#order:hover { background: var(--wash); }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }

/* ---------- timeline ---------- */
main { padding: 8px 0 40px; }
.month { padding-top: 26px; }
.month h2 { margin: 0 0 6px; font-size: 19px; line-height: 1.25; font-weight: 650; letter-spacing: -0.012em; display: flex; gap: 10px; align-items: baseline; }
.month h2 small { color: var(--muted); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; }
.tl { list-style: none; margin: 0; padding: 0 0 0 26px; position: relative; }
.tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--grid); border-radius: 1px; }
.tl > li { position: relative; padding: 12px 0; border-bottom: 1px solid var(--grid); }
.tl > li:last-child { border-bottom: 0; }
.tl > li::before { content: ""; position: absolute; left: -25px; top: 19px; width: 12px; height: 12px; border-radius: 4px;
  background: var(--k, var(--other)); box-shadow: 0 0 0 3px var(--bg); }
.tl > li.k-flyway { --k: var(--s0); }
.tl > li.k-custom { --k: var(--s1); }
.tl > li.k-base { --k: var(--s2); }
.tl > li.gone::before { background: var(--bg); box-shadow: 0 0 0 3px var(--bg), inset 0 0 0 2px var(--k); }
.tl > li.ms { --k: var(--s6); padding: 16px 0; }
.tl > li.ms::before { transform: rotate(45deg); border-radius: 2px; left: -26px; top: 22px; width: 14px; height: 14px; }
.ms .mt { font-weight: 650; font-size: 16px; }
.ms .mx { color: var(--ink2); font-size: 14px; margin: 3px 0 0; max-width: 78ch; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ver { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; color: var(--k); white-space: nowrap; }
.nm { font-weight: 600; overflow-wrap: anywhere; }
.cls { color: var(--muted); font-size: 12.5px; }
.pill { font-size: 11.5px; border-radius: 999px; padding: 0 8px; line-height: 19px; border: 1px solid var(--border); color: var(--ink2); white-space: nowrap; }
.pill.st-current { border-color: color-mix(in srgb, var(--s5) 55%, transparent); color: var(--s5); }
.pill.st-folded { border-color: color-mix(in srgb, var(--s2) 55%, transparent); color: var(--s2); }
.pill.st-removed, .pill.st-renamed { border-color: color-mix(in srgb, var(--s7) 55%, transparent); color: var(--s7); }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.meta a { color: var(--ink2); }
.notes { margin: 5px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink2); }
.notes li::before { content: "\2192\00a0"; color: var(--muted); }
.notes .again { color: var(--s1); font-weight: 600; }
.tables { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.tables code { font-size: 11.5px; background: var(--wash); border-radius: 5px; padding: 1px 6px; color: var(--ink2); }
.tables button { background: none; border: 0; padding: 0 4px; font-size: 12px; color: var(--muted); text-decoration: underline; }
.subj { margin: 7px 0 0; font-size: 13.5px; color: var(--ink2); }
details { margin-top: 3px; font-size: 13px; color: var(--ink2); }
summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
details pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; padding: 10px 12px; background: var(--raised);
  border: 1px solid var(--grid); border-radius: 8px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#empty { color: var(--muted); padding: 30px 0; }

footer { border-top: 1px solid var(--grid); padding: 22px 0 60px; color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 8px; max-width: 86ch; }

@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .top { padding-top: 26px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; padding: 24px 0; }
  .sep { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="wrap">
<main id="tl"></main>

way for database migrations, enhance database setup with HikariCP, and streamline dependency property conventions"},{"sha":"590872e4c04fb484db378a9111512319e136e41f","date":"2025-12-18","summary":"feat: add favorite sync tracking for Tidal service","message":"feat: add favorite sync tracking for Tidal service\n\n- Introduce `FavSync` functionality with `FavSyncTable` database schema and `FavSyncService`.\n- Implement migration `V1_1__FavSync` to create the necessary database structure.\n- Enhance `DownloadService` to track and sync favorite songs changes based on the last sync time.\n- Add serialization support for `FavSync` with `DateSerializer` and `UUIDSerializer`.\n- Refactor dependency injection in `Application.kt` to include `FavSyncService`."},{"sha":"c80e56f216a10e0e49d2c6423e0143c8b2179364","date":"2025-12-20","summary":"feat: introduce UserPlaylist support and related enhancements","message":"feat: introduce UserPlaylist support and related enhancements\n\n- Add `UserPlaylist` feature with API routes for retrieval, search, and listing.\n- Create `UserPlaylistService` with CRUD methods and playlist management functionality.\n- Add database schema and migration for `UserPlaylist` and `UserPlaylistSong`.\n- Refactor `BasePlaylist` and extend `Playlist` and `UserPlaylist` models for unified structure.\n- Enhance metadata handling to support playlist tracks and associated data.\n- Adjust download workflow to handle UserPlaylist creation and song additions dynamically."},{"sha":"f2e704dffbca8aa29dde20c1ecc3dbb20d4e5fad","date":"2025-12-21","summary":"feat: replace `position` with `addedAt` for playlist song ordering and enhance playlist functionalities","message":"feat: replace `position` with `addedAt` for playlist song ordering and enhance playlist functionalities\n\n- Transition `UserPlaylistSongTable` from using `position` to `addedAt` as the primary sorting field for increased flexibility.\n- Add `origin` field to playlists for better metadata context.\n- Update `addToPlaylist` and related services to handle `addedAt` dynamically and improve efficiency.\n- Introduce helper methods in `Map` and `List` extensions for value filtering and subtraction.\n- Implement `V1_3__UserPlaylistFix` Flyway migration for database updates.\n- Enhance `DownloadService` to support precise song addition and metadata integration."},{"sha":"4119974fcf8acf208e50ce5c75dd995b91a0a47e","date":"2025-12-22","summary":"feat: add support for `originalId` in albums and enhance metadata matching logic","message":"feat: add support for `originalId` in albums and enhance metadata matching logic\n\n- Introduce `originalId` field in `AlbumTable` and related models to improve album uniqueness and metadata handling.\n- Refactor `Quintuple` for managing additional album attributes.\n- Update `SongService` and `AlbumService` to utilize `originalId` for more precise matching and insertion logic.\n- Implement Flyway migration `V1_4__AlbumOriginalId` for database schema updates.\n- Enhance logging and metadata flow in `DownloadService` to integrate `originalId` gracefully."},{"sha":"56a73221483bd3bc0bb97475d2014ea1d95b7411","date":"2025-12-23","summary":"feat: add artist aliasing and merging support","message":"feat: add artist aliasing and merging support\n\n- Introduce `ArtistAliasTable` for managing artist aliases in the database.\n- Add support for merging multiple artists into one with alias generation and image handling in `ArtistService`.\n- Enhance search to include aliases in `SongService`, `AlbumService`, and `ArtistService`.\n- Update migrations to include alias table creation.\n- Improve string utilities with URL check and accent stripping functions."},{"sha":"257671ddb4e215441cb880b60ea08b6d9cfe2ea9","date":"2026-01-31","summary":"Add session management and tracking","message":"Add session management and tracking\n\nImplemented a session management system to track active user sessions, enforce session validity, and support remote session revocation.\n\nKey changes:\n- **Session Service**: Added `SessionService` and `ISessionService` to create, retrieve, and deactivate sessions.\n- **Database**: Introduced `SessionTable` and updated `RefreshTokenTable` to associate tokens with sessions. Added migrations `V1_6__Session` and `V1_7__RefreshToken`.\n- **Authentication**:\n    - Updated `JwtService` to include the session ID in JWT claims and validate session activity.\n    - Introduced `RpcAuthService` to initialize sessions with metadata (IP, User-Agent) during login.\n    - Updated `RefreshTokenService` to store and retrieve session IDs.\n- **Scheduling**: Added a scheduled task to clean up old sessions and corrected cron expression generation in `ScheduleService`.\n- **RPC**: Exposed session management via `RpcSessionService` and updated `IAuthService` implementation."},{"sha":"fbbedb570a37ab264f5507c69b129eec7d8d4672","date":"2026-03-06","summary":"backups, db export/import","message":"backups, db export/import\nisAdmin as user property"},{"sha":"3ea34206bfafc8cb9be2321f716024b3dab72d74","date":"2026-03-09","summary":"add MetadataFetchingService and scheduled artist image fetch","message":"add MetadataFetchingService and scheduled artist image fetch\ntrack lastImageCheck for artists"},{"sha":"18635a6f1572f56057c62501d8f2c4427c1c8eec","date":"2026-03-10","summary":"artist split aliases","message":"artist split aliases\nhandle multiple artist IDs per name in bulk create"},{"sha":"efcfccf77f6c1f18ae475262a5446f077270fa81","date":"2026-03-16","summary":"add musicbrainz integration","message":"add musicbrainz integration\nfetch and store musicbrainz ids for songs\nsupport manual task triggering"},{"sha":"0030aeb32123eb626d07ed69b7880a1703a945c2","date":"2026-03-19","summary":"add user display names and profile images","message":"add user display names and profile images\ndatabase migration for user profile updates\nremote image proxying and mirror UI enhancements\nimplement profile management in RpcUserService\nupdate common-rpc dependency"},{"sha":"a5147473c4aac45dbb40883008e9efb3336bc071","date":"2026-03-21","summary":"add scheduled task logging and monitoring","message":"add scheduled task logging and monitoring\nimplement `logTask` helper and `ScheduledTaskLogService` for worker tracking\nupdate background services to return execution statistics and result counts\nadd database migration and RPC interface for task history\nrefine remote mirror playlist sync to include song entries\nconfigure `kotlinx-rpc` compiler plugins for the project"},{"sha":"6de666011fbfb137f46fc63276274c7cc40b1888","date":"2026-03-28","summary":"add custom migration service and tracking table","message":"add custom migration service and tracking table\nsync artists, lyrics, and MusicBrainz IDs to FLAC tags\nimplement TagMusicBrainzIds migration\nupgrade to JDK 25 and add test suite dependencies"},{"sha":"b2694d4686fd9d8fe36b522d08890578224b2c7a","date":"2026-03-29","summary":"feat(library): Implement score-based album merging and enhance MusicBrainz search","message":"feat(library): Implement score-based album merging and enhance MusicBrainz search\n\nThis commit introduces a more sophisticated, score-based fuzzy matching system for merging duplicate albums and enhances the accuracy of MusicBrainz artist lookups.\n\n### Features:\n-   **Score-Based Album Merging**:\n    -   Replaces the rigid property-based grouping for albums without an `originalId`.\n    -   A new `calculateSimilarity` function scores album pairs based on weighted criteria:\n        -   Matching `coverId` (high score)\n        -   Matching `name` and `releaseDate` (medium score)\n        -   Matching individual properties (low score)\n        -   Jaccard similarity of album artist lists (significant factor)\n    -   Albums with a similarity score above a threshold (140) are grouped and merged, ensuring the album with the highest data quality is kept.\n    -   The system now skips merging groups where all albums have a `null` release date or zero songs.\n\n-   **Enhanced MusicBrainz Artist Search**:\n    -   Improves the accuracy of artist searches by including the artist's `type` (`group` or `person`) in the query, leveraging the existing `isGroup` flag.\n\n-   **RPC for MusicBrainz Artist Search**:\n    -   Adds a new RPC endpoint `searchArtistOnMusicBrainz` with pagination to allow clients to search for artists directly on MusicBrainz.\n    -   Introduces a shared `MusicBrainzArtist` data class in the `common-rpc` module.\n\n### Refactor:\n-   **MusicBrainz ID Schema**:\n    -   Refactors the database schema to use separate `AlbumMusicBrainzTable` and `ArtistMusicBrainzTable`, aligning with the existing pattern for songs and improving data normalization.\n-   **Metadata Service Access**:\n    -   Corrects the `LibraryMergeService` to access `TidalService` via the static `MetadataService.getMetadataService` method, resolving a Koin dependency injection issue and aligning with the project's architecture."},{"sha":"2a61f270d3daeea4480fce4951ad17449f98cf4d","date":"2026-03-31","summary":"feat: implement recent releases worker and improve metadata fetching","message":"feat: implement recent releases worker and improve metadata fetching\n\n- Add `RecentReleaseWorker` to automatically fetch new releases daily.\n- Enhance `ReleaseService` to fetch releases from MusicBrainz and resolve cross-platform links via api.song.link.\n- Refactor `HttpClientQueueService` to apply per-host rate limiting (with specific delays for musicbrainz.org and api.song.link) instead of a global queue.\n- Update `RecentReleaseTable` to include `artistName` and add corresponding Flyway and custom migrations.\n- Introduce Testcontainers for PostgreSQL in `TestDatabase` to run integration tests against a real database, with a graceful fallback to H2 when Docker is unavailable.\n- Add comprehensive unit tests for `AppleMusicService`, `SpotifyService`, `TidalService`, and `SongService`.\n- Configure `DOCKER_HOST` in Gradle test tasks and GitHub Actions for Testcontainers compatibility.\n- Register new services and workers in the application's Koin module."},{"sha":"67cc5e22ed665193da3632ad41ae46c5978c12b3","date":"2026-03-31","summary":"keep all releases, but link them.","message":"keep all releases, but link them."},{"sha":"248d0c7a10d3b92ac87bf57cd7d8a4abba432f73","date":"2026-04-01","summary":"add progress tracking and logging to scheduled tasks","message":"add progress tracking and logging to scheduled tasks\nimplement TaskContext for real-time task updates\nadd database migration for task progress and log columns\nupdate service methods (backup, cleanup, fetching) to support progress callbacks\nrefine image cleanup logic to include RecentReleaseTable references\nadd unit tests for unreferenced image deletion with release metadata"},{"sha":"539b2f3a7ca392fbad10c97e9b28c1f12281665f","date":"2026-04-02","summary":"add genre support for artists, albums, and songs","message":"add genre support for artists, albums, and songs\nintegrate TheAudioDB as a new metadata provider\nimplement GenreService and database migrations for genre tables\nenhance MetadataFetchingService with batch processing and MBID support\nupdate MusicBrainzService to include tags and genres in lookups\nadd unit tests for genre services and TheAudioDB integration"},{"sha":"86c7fa507ee87a34e95ddbf64d54f22d374102ae","date":"2026-04-02","summary":"add lastMetadataCheck to artist, album, and song tables","message":"add lastMetadataCheck to artist, album, and song tables\nimplement GenreMetadataWorker for periodic genre updates\nrefactor MetadataFetchingService with timestamp tracking and MusicBrainz integration\nadd database migration for metadata check timestamps"},{"sha":"089d88ad9226125c7acf0cbc2f3fee03f71ebdb3","date":"2026-04-06","summary":"add synced lyrics support and transcription service","message":"add synced lyrics support and transcription service\nimplement `SyncedLyrics` models and custom duration serialization\nadd `LyricsService` with database persistence and RPC integration\nintroduce Python-based transcriber service using WhisperX and FastAPI\nupdate Docker and CI configurations for transcriber deployment with GPU support"},{"sha":"4ded3d8b91110692049bf0b52e7d5d18eaac53a7","date":"2026-04-06","summary":"add lyrics sync worker and schedule daily task","message":"add lyrics sync worker and schedule daily task\noptimize transcriber alignment with language detection and beam size tuning\ntrack raw lyrics in database and add migration for schema changes\nrefactor lyrics service to support background processing and improved retrieval\nadd unit tests for lyrics synchronization logic"},{"sha":"609a383fc5fc047e0d25e0cfa4abbdcada264623","date":"2026-04-07","summary":"add LrcLib service and worker for automated lyrics fetching","message":"add LrcLib service and worker for automated lyrics fetching\nimplement daily scheduled task for LrcLib syncing\nadd lastLyricsFetchAttempt to SongTable with migration\nrefactor worker tests to support multiple database dialects"},{"sha":"a813ce677280c50e3fc75c6608c846cbd8f16f22","date":"2026-04-09","summary":"implement MusicBrainz metadata cache and migrate IDs to UUID","message":"implement MusicBrainz metadata cache and migrate IDs to UUID\n\n* Update domain models, services, and RPC interfaces to use `PlatformUUID` for MusicBrainz identifiers.\n* Add comprehensive database schema for persistent MusicBrainz metadata, including tables for artists, releases, recordings, and areas.\n* Introduce `MusicBrainzCacheService` to manage local metadata storage and retrieval.\n* Implement `MusicBrainzCacheWorker` to automatically refresh stale metadata in the background.\n* Add database migrations to create cache tables and link existing library items via foreign key constraints.\n* Refactor `SongService`, `AlbumService`, and `ArtistService` to integrate with the new caching layer.\n* Expose MusicBrainz metadata through a new `IMusicBrainzService` RPC interface.\n* Update the file indexer to parse MusicBrainz identifiers as UUIDs from audio tags."},{"sha":"52278fd8b441c471647c3d4bef4200ae087ede3b","date":"2026-04-24","summary":"feat: universal downloader architecture and plugin system","message":"feat: universal downloader architecture and plugin system\n\n- Implement a modular plugin system (`plugin-api`) allowing for built-in and external JAR-based extensions.\n- Refactor the downloader logic from a Tidal-specific implementation into a generic, multi-backend architecture using `DownloaderProxy` and `BaseDownloadService`.\n- Introduce native YouTube support via `YoutubePlugin`, enabling track searching, indexing, and downloading directly from YouTube.\n- Significantly enhance MusicBrainz integration with a dedicated `MusicBrainzMetadataService`, expanded search capabilities, and background workers for metadata caching.\n- Restructure project packages, moving and renaming download-related services from `tdn` to `download` for better organization.\n- Add database migrations for MusicBrainz media/track metadata (`V1_27`) and legacy Tidal ID prefixing.\n- Expand RPC interfaces to expose new MusicBrainz and Metadata services.\n- Add configuration support for `YOUTUBE_API_KEY` and updated Docker environment variables."},{"sha":"5096a23c02a3949d3438bd24b3f16d16b76f72cb","date":"2026-04-26","summary":"feat: introduce audio analysis and song discovery services","message":"feat: introduce audio analysis and song discovery services\n\n- Added `AudioAnalysisService` to extract BPM, key, scale, and mood metrics using Essentia integration.\n- Introduced `DiscoveryService` providing song recommendations based on feature similarity and shared credits (composers, lyricists, producers).\n- Implemented new database tables for `song_audio_data` and person-based song credits.\n- Refactored scheduled tasks into a unified `Worker` base class, simplifying `LyricsSyncWorker`, `MusicBrainzWorker`, and others.\n- Integrated a new `AudioAnalysisWorker` to process unanalyzed tracks automatically.\n- Updated the Docker runtime environment to include Essentia extractor binaries and required libraries.\n- Extended `SongService` and metadata indexers to support persisting and retrieving audio analysis data."},{"sha":"82e393dd0610cf3fe2b0612b971be224780218dd","date":"2026-04-26","summary":"feat: implement valence calculation and improve discovery similarity logic","message":"feat: implement valence calculation and improve discovery similarity logic\n\n- Introduced the `AudioScale` enum to represent musical scales, replacing raw string types in `SongAudioData`.\n- Implemented `ValencePostProcessor` to derive mood (valence) and energy metrics from raw Essentia analysis data.\n- Refactored `DiscoveryService` similarity logic to use a weighted distance builder, incorporating valence and adjusted feature weights for better recommendations.\n- Added a multi-threaded custom migration, `ReAnalyzeMissingValence`, to backfill audio analysis for songs missing mood data.\n- Introduced an `AudioAnalysisPostProcessor` pipeline in `AudioAnalysisService` for extensible refinement of extracted audio features.\n- Added default constants for audio features (BPM, energy, valence, etc.) to `SongAudioData`.\n- Updated unit tests to cover valence calculation, mood-based discovery, and post-processor integration."},{"sha":"53c71f429d0b570be21cd969e3bdc92a529c1462","date":"2026-04-26","summary":"refactor: transition artist-group relationship to many-to-many","message":"refactor: transition artist-group relationship to many-to-many\n\n- Introduced `ArtistMemberTable` to replace the `groupId` column in `ArtistTable`, enabling artists to belong to multiple groups.\n- Added Flyway migration `V1_29` to port existing group associations to the new bridge table and drop the legacy column.\n- Updated `ArtistService`, `AlbumService`, and `SongService` to utilize `ArtistMemberTable` for joining artist, group, and member data.\n- Refactored database queries throughout the project to use modern Exposed `innerJoin` and `leftJoin` DSL extensions instead of the deprecated `JoinType` syntax.\n- Updated test suites and custom migrations to align with the new schema and many-to-many relationship logic."},{"sha":"9d89265f7bdcee1160b54ba3da5c6e2b072fba9e","date":"2026-05-03","summary":"feat: implement mock server and dynamic parallel worker scaling","message":"feat: implement mock server and dynamic parallel worker scaling\n\nIntroduced a dedicated mock server module for testing RPC services and refactored background workers to support dynamic, load-aware parallel processing.\n\n**Mock Server**\n- Added a new `mock-server` module that uses reflection and Ktor to host mock implementations of RPC and REST services.\n- Implemented `MockGenerator` to automatically generate dummy data for service interfaces, supporting common types, collections, Flows, and PaginatedResponses.\n- Updated GitHub Actions and Docker configurations to build and publish the mock server.\n\n**Worker Infrastructure**\n- Refactored the base `Worker` class to include a `runParallel` utility that dynamically scales coroutine counts based on system load and active workers.\n- Implemented a global `Worker` registry to balance CPU core allocation among concurrent background tasks, preventing system exhaustion.\n- Added a `WORKER_THREAD_MULTIPLIER` environment variable to allow manual scaling of background task intensity.\n- Added comprehensive unit tests in `WorkerTest` to verify thread allocation logic under various system constraints.\n\n**Audio & FLAC Analysis**\n- Introduced `FlacAnalysisService` and `FlacAnalysisWorker` to extract technical metadata (bit depth, sample rate) and fix malformed seekpoints in FLAC files using `metaflac`.\n- Added `FlacInfoTable` and a database migration to persist FLAC-specific technical data.\n- Migrated `AudioAnalysisWorker` and `AutoTranscodeWorker` to the new `runParallel` architecture.\n\n**Core & RPC**\n- Added `getAllServiceClasses()` to `RpcClientFactory` to facilitate service discovery within the mock server.\n- Cleaned up unused RPC stubs and updated project documentation for new environment variables."},{"sha":"e8e27ac78818f6e67ca666207cde18e02d1876bf","date":"2026-05-09","summary":"feat: implement image BlurHash support and metadata tracking","message":"feat: implement image BlurHash support and metadata tracking\n\n- Added `ImageMetadataTable` to store image dimensions, file size, and detailed color information including primary color, luminance, and a 5-color palette.\n- Introduced a `blurHash` column to `ImageTable` and updated the `Image` RPC model to include metadata and palette fields.\n- Expanded `Song`, `Album`, `Artist`, `Playlist`, `RecentRelease`, and `User` models to include a `blurHash` property for their respective images.\n- Updated `ImageService` to aggregate metadata and color data via a left join with `ImageMetadataTable`.\n- Refactored retrieval logic in `SongService`, `AlbumService`, `ArtistService`, `PlaylistService`, and `UserService` to include `ImageTable` joins for consistent `blurHash` delivery.\n- Updated Rust bridge definitions in `lib.rs` to maintain parity with the revised common RPC models.\n- Added and updated unit tests across all services to verify correct mapping of image metadata and blur hashes."},{"sha":"ff5b0b8809a3077d07ab7caaff34cad06e05aaab","date":"2026-05-13","summary":"feat: implement fine-grained user capabilities and annotation-based authorization","message":"feat: implement fine-grained user capabilities and annotation-based authorization\n\nIntroduced a granular permission system to replace simple boolean admin checks, allowing for more specific control over user actions like downloading, editing, and deleting content.\n\nKey changes:\n- **Core Authorization**: Added `UserCapability` enum (DOWNLOAD, EDIT, DELETE) and implemented `@RequiresAdmin` and `@RequiresCapability` annotations for RPC service methods.\n- **Security Proxy**: Created a dynamic proxy utility, `withAuthorization`, that intercepts service calls to enforce permission requirements based on the new annotations.\n- **Service Refactoring**: Applied permission annotations across all major service interfaces (Song, Album, Artist, Mirror, Backup, etc.) and removed redundant manual authorization checks from implementation classes.\n- **Infrastructure**:\n    - Added `UserCapabilityTable` to the database and implemented a Flyway migration (`V1_32`) to support the new schema.\n    - Updated `User` and `UserInfo` models to include assigned capabilities.\n    - Integrated the authorization proxy into `RpcRegistry` and `RestRegistry`, including centralized handling for `UnauthorizedException`.\n- **Documentation**: Updated the `DocProcessor` to replace the \"Admin\" column with a \"Permissions\" column in generated documentation, reflecting specific capability requirements.\n- **Testing**: Added `CapabilityAuthorizationTest` to verify the proxy-based enforcement of user permissions."},{"sha":"cc417bf22615df4243fcc26df0e43f26f4b20be5","date":"2026-05-15","summary":"feat: implement color-based search for songs, albums, artists, and playlists","message":"feat: implement color-based search for songs, albums, artists, and playlists\n\n- Introduced `ColorUtils` to handle conversions from RGB to HSL and LAB color spaces.\n- Updated `ImageMetadataTable` schema to include columns for hue, saturation, lightness, and LAB coordinates.\n- Added a `filterByColor` extension for database queries to perform Euclidean distance-based filtering in the LAB color space.\n- Implemented `byColor` search functionality across `SongService`, `AlbumService`, `ArtistService`, and `UserPlaylistService`.\n- Updated RPC service interfaces (`ISongService`, `IAlbumService`, etc.) and the Rust bridge to support the new color search parameters.\n- Added database migration `V1_33` to update the image metadata schema.\n- Included unit tests for color space conversions and integration tests for color-based library searching."},{"sha":"9831c5dfc4607f1b008fc82d60111a502d30483e","date":"2026-05-16","summary":"feat: implement progressive image backfilling for recent releases","message":"feat: implement progressive image backfilling for recent releases\n\n- Added a `lastImageFetch` column to `RecentReleaseTable` and created a corresponding Flyway migration.\n- Implemented `backfillMissingRecentReleaseImages` in `ReleaseService` to asynchronously retrieve missing cover art for releases.\n- Introduced a progressive cooldown strategy that scales the fetch frequency based on the age of the release (ranging from 1 day for new releases to 30 days for older ones).\n- Integrated the backfill process into the `fetchNewReleases` workflow, using a `Semaphore` to limit concurrent network requests.\n- Added comprehensive unit tests in `ReleaseServiceTest` to verify the backfill logic, cooldown enforcement, and tier-based scheduling."},{"sha":"c5a42937dd6b652bc17c7993e30ad37f1735a5b7","date":"2026-05-17","summary":"feat: implement multi-provider song identification and centralized URL parsing","message":"feat: implement multi-provider song identification and centralized URL parsing\n\nIntroduced a robust system for tracking and identifying songs across multiple external platforms (YouTube, Spotify, Tidal, SoundCloud, etc.) by storing provider-specific metadata in a dedicated table.\n\n- **Database**: Added `SongProviderTable` to store external IDs, providers, and raw URLs for songs. Included a Flyway migration and a custom migration to backfill the table from existing song data.\n- **URL Parsing**: Implemented a unified `UrlParser` framework and `ParserFactory` to extract platform-specific identifiers and content types from URLs. Supported providers include YouTube, SoundCloud, Tidal, Spotify, MusicBrainz, and ListenBrainz.\n- **Song Service**:\n    - Updated `byOriginalIds` and added `byOriginalUrls` to support song lookups across all stored provider metadata.\n    - Enhanced `createBatch` and `bulkFindExistingSongs` to prevent duplicates by matching against external provider identifiers.\n    - Integrated provider information into the core song mapping logic.\n- **Deduplication**: Updated `LibraryMergeService` to correctly merge and reassign `SongProviderTable` entries when consolidating duplicate songs.\n- **Refactoring**:\n    - Migrated `Tidal`, `YouTube`, and `SoundCloud` importers to use the centralized `ParserFactory` for URL handling.\n    - Moved `PrefixedId` utility to `common-rpc` for shared usage across services.\n- **Testing**: Added comprehensive tests for URL parsers, provider-based song lookups, and deduplication scenarios."},{"sha":"1d08d383b9edae4be2647dcedd32bd4788292dc8","date":"2026-05-17","summary":"feat: implement AlbumProviderTable and enhance album lookup by external IDs","message":"feat: implement AlbumProviderTable and enhance album lookup by external IDs\n\n- Introduced `AlbumProviderTable` to track and store album mappings from external providers, including provider names, external IDs, and raw URLs.\n- Added Flyway migration `V1_36` and a custom migration `PopulateAlbumProviderTable` to initialize the new table with existing metadata.\n- Updated `IAlbumService` and `AlbumService` with `byOriginalIds` and `byOriginalUrls` methods to support album lookups via third-party identifiers.\n- Refactored `AlbumService.getOrBulkCreate` to leverage the provider table for more accurate album matching and deduplication during imports.\n- Enhanced `LibraryMergeService` to migrate associated provider records when merging duplicate albums.\n- Updated relevant unit tests and the Rust bridge to reflect changes in the database schema and RPC interface."},{"sha":"624b42c6424769f1fe288a019862e9599fe344f5","date":"2026-05-17","summary":"feat: introduce RecentReleaseProviderTable and migrate release links","message":"feat: introduce RecentReleaseProviderTable and migrate release links\n\n- Added `RecentReleaseProviderTable` to store structured external provider information (e.g., Spotify, Tidal) for releases, including external IDs and raw URLs.\n- Implemented a Flyway migration (`V1_37`) and a custom migration script to populate the new table by parsing existing JSON links in `RecentReleaseTable`.\n- Updated `ReleaseService` to fetch release links from the provider table using an efficient grouped lookup instead of parsing JSON strings on the fly.\n- Modified `ReleaseService` to upsert provider data whenever new releases are discovered or updated.\n- Enhanced `SpotifyParser` to handle `spotify.com` root domain URLs in addition to subdomains.\n- Added comprehensive tests for the custom migration and updated existing service tests to verify provider data integrity."},{"sha":"df7b6361bfde1d38a25e27342d1bff6d05cd7f26","date":"2026-05-17","summary":"feat: expand URL parser support and implement provider fulfillment migration","message":"feat: expand URL parser support and implement provider fulfillment migration\n\n- Added over 15 new URL parsers to `common-rpc` for music services including Bandcamp, Genius, AllMusic, Last.fm, Audiomack, Audius, and more.\n- Updated `ParserFactory` to include the new parsers, enabling identification of IDs and types (Song, Album, Artist, Playlist) from a wider range of external links.\n- Implemented the `FulfillUnknownProviders` custom migration (v1.9) to retroactively resolve database entries previously marked with an \"unknown\" provider using the newly available parsers.\n- Refactored `UrlParserTest` to use a more structured, enum-based testing pattern and added comprehensive test cases for all new service providers.\n- Added `FulfillUnknownProvidersTest` to verify that the migration correctly updates `SongProviderTable`, `AlbumProviderTable`, and `RecentReleaseProviderTable` across different database dialects."},{"sha":"674e291d279f6793643978867e1688173beb32e8","date":"2026-05-17","summary":"feat: implement provider enrichment and cross-platform link resolution","message":"feat: implement provider enrichment and cross-platform link resolution\n\nIntroduced a background enrichment system to automatically discover and store external platform links for songs and albums using MusicBrainz relations and the Odesli (Song.link) API.\n\n- **Provider Enrichment**: Added `ProviderEnrichmentWorker` to orchestrate parallel enrichment of songs and albums, tracking progress via new `lastProviderEnrichment` database columns.\n- **Odesli Integration**: Created `OdesliService` to resolve links across supported domains (Spotify, Apple Music, Tidal, YouTube, etc.) and integrated it into `SongService`, `AlbumService`, and `ReleaseService`.\n- **Parser Enhancements**:\n    - Updated the `UrlParser` interface and all implementations to support bidirectional conversion with a new `toUrl(id, type)` method.\n    - Added `TikTokParser` to support music links from TikTok.\n    - Improved `RateYourMusicParser` to handle artist profiles and additional release types (EPs, mixtapes, DJ mixes).\n- **MusicBrainz Updates**: Updated `MusicBrainzService` and data models to fetch and store `url-rels` for recordings and releases.\n- **Database Migrations**: Added migrations `V1_38` and `V1_39` to introduce tracking columns for provider enrichment and artist release checks.\n- **Core Improvements**: Centralized duration randomization utilities in `Duration.kt` and added an `active` state check to the base `Worker` class."},{"sha":"1a3011916f6626b9ba8aa700abac28e9718f418a","date":"2026-05-18","summary":"refactor: enhance metadata resolution with ISRC/UPC support and persistent MusicBrainz relations","message":"refactor: enhance metadata resolution with ISRC/UPC support and persistent MusicBrainz relations\n\n- Updated `OdesliService` to support link resolution via ISRC and UPC identifiers, prioritizing these over URL-based resolution in `batchResolve`.\n- Expanded the database schema with `MBRecordingIsrcTable` and `MBRelationTable` to persist MusicBrainz identifiers and external resource links.\n- Modified `SongService` and `AlbumService` to extract ISRC and barcode (UPC) data from MusicBrainz metadata to improve the accuracy of provider enrichment.\n- Updated `MusicBrainzCacheService` to handle the storage and retrieval of relations and ISRCs for recordings, releases, and release groups.\n- Extended the `MusicBrainzRecording` model in `common-rpc` and the Rust bridge to include ISRC fields.\n- Updated `MusicBrainzService` to request ISRC data when fetching recording details from the MusicBrainz API.\n- Added a Flyway migration (`V1_40`) to initialize the new MusicBrainz tables."},{"sha":"a43e59173444ce55193bf4c0c120028f67a14301","date":"2026-05-19","summary":"feat: implement configurable background tasks and centralized scheduling","message":"feat: implement configurable background tasks and centralized scheduling\n\nIntroduced a persistent configuration system for background tasks, allowing triggers and enabled states to be managed via database and RPC.\n\n- **Task Configuration**: Added `ScheduledTaskConfigurationService` and `ScheduledTaskConfigurationTable` to persist task settings. Introduced `TriggerDefinition` to support Cron, Interval, Manual, and \"AfterTask\" dependencies in a serializable format.\n- **Dynamic Scheduling**: Refactored `ScheduleService` to manage tasks by unique keys. It now dynamically updates schedules based on configuration changes streamed from the database.\n- **RPC API**: Added `IScheduledTaskConfigurationService` to the RPC and REST registries, enabling administrative management of background tasks.\n- **Task Organization**: Centralized task registration by moving hardcoded logic from `Application.kt` to a dedicated `configureScheduledTasks` extension.\n- **Dependency Handling**: Updated `TaskCompletionTrigger` and `IScheduleService` to support string-based task keys for dependencies, ensuring persistent task chaining across service restarts.\n- **Release Service**: Extended `IReleaseService` with new methods to fetch recent releases by artist or MusicBrainz ID.\n- **Database**: Added a Flyway migration (`V1_42`) for the new task configuration table.\n\n```kotlin\n// Example of the new TriggerDefinition used for persistence\n@Serializable\nsealed class TriggerDefinition {\n    data class Cron(val expression: String) : TriggerDefinition()\n    data class Interval(val intervalSeconds: Long) : TriggerDefinition()\n    data class AfterTask(val dependencyKey: String) : TriggerDefinition()\n    data object Manual : TriggerDefinition()\n}\n```"},{"sha":"e25dcb6661ae782c785c50d6e03f03db8151173a","date":"2026-05-23","summary":"fix: implement incorrect album merge detection and recovery logic","message":"fix: implement incorrect album merge detection and recovery logic\n\n- Added `fixIncorrectMerges` to `LibraryMergeService` to identify and split albums where songs have mismatching cover art or MusicBrainz release IDs.\n- Refined `calculateSimilarity` to return a zero score if albums have explicitly different covers or MusicBrainz identifiers, preventing incorrect future merges.\n- Implemented `splitSongsToNewAlbum` to move songs to a newly created album while preserving metadata, artist associations, and genre links.\n- Added a safety check in the primary merge loop to skip original ID groups that contain conflicting MusicBrainz IDs.\n- Introduced a custom database migration (`2.1`) to automatically invoke the recovery logic.\n- Added comprehensive unit tests in `LibraryMergeServiceIncorrectMergeTest` to verify splitting behavior and similarity scoring across different scenarios."},{"sha":"7915d129a7b010012f50f3bd3e656b547011dcd6","date":"2026-05-25","summary":"refactor: refine album merge logic and enhance MusicBrainz track matching","message":"refactor: refine album merge logic and enhance MusicBrainz track matching\n\nImproved the robustness of album merging and metadata synchronization by introducing track collision detection and more flexible MusicBrainz matching strategies.\n\n- **Library Merging**: Updated `LibraryMergeService` to detect and split incorrectly merged albums based on track position collisions (duplicate disc/track numbers) and MusicBrainz Release Group IDs.\n- **Track Matching**: Enhanced `AlbumService` matching logic to include fallbacks for case-insensitive title matches, \"cleaned\" title comparisons, and duration-based proximity (within 2 seconds).\n- **Synchronization**: Refactored song synchronization into a reusable `syncSongsWithMusicBrainz` method that performs upserts on the `SongMusicBrainzTable`.\n- **Migrations**: Added a new custom migration `FixIncorrectAlbumMergesV2` to apply the refined splitting logic to existing library data.\n- **Testing**: Updated `LibraryMergeService` tests to verify splitting behavior during track collisions and improved mocking for `AlbumService` interactions.\n- **IDE Configuration**: Updated `deviceStreaming.xml` with new persistent device selections for various Samsung and Google Pixel models."},{"sha":"d94dbbeed7b23490f336d3cb3ce7054f965bfaef","date":"2026-05-25","summary":"feat: synchronize album song counts with MusicBrainz metadata","message":"feat: synchronize album song counts with MusicBrainz metadata\n\n- Introduced `UpdateAlbumSongCounts` as a custom migration to backfill song counts for existing albums using MusicBrainz release data.\n- Updated `AlbumService.syncAlbumSongsWithMusicBrainz` to calculate and persist the total track count when syncing album metadata.\n- Improved data consistency by summing track counts across all media components within a MusicBrainz release."},{"sha":"0a8820f35939156dab9909b41d3df6bce6025715","date":"2026-06-01","summary":"feat: add support for ISRC and Barcode metadata matching","message":"feat: add support for ISRC and Barcode metadata matching\n\n- Added `isrc` field to songs and `barcode` field to albums across RPC models and database tables.\n- Implemented database migration `V1_43` to add `isrc` and `barcode` columns to `SongTable` and `AlbumTable`.\n- Enhanced `MusicBrainzService` to prioritize lookups using ISRC for recordings and Barcode for releases, improving metadata accuracy.\n- Updated `BaseIndexer` and `TidalPlugin` to extract these identifiers from audio file tags and external sources.\n- Updated `AlbumService` and `SongService` to handle persistence and utilize these identifiers during synchronization and track matching.\n- Refactored `common-rpc` Rust bridge bindings to reflect the updated data structures and service interfaces.\n- Added unit tests to verify metadata matching and synchronization logic for ISRC and Barcode."},{"sha":"a32c7d68f464a8d0b315452867de4707c27f7ec2","date":"2026-06-02","summary":"feat: implement migration to fill ISRCs and barcodes from MusicBrainz data","message":"feat: implement migration to fill ISRCs and barcodes from MusicBrainz data\n\n- Added `FillIsrcAndBarcode` custom migration to backfill missing `isrc` values in `SongTable` and `barcode` values in `AlbumTable` using linked MusicBrainz records.\n- Implemented progress reporting and task logging within the migration to track update status.\n- Added `FillIsrcAndBarcodeTest` to verify migration logic across supported database dialects, ensuring data is correctly mapped and existing values are not overwritten."},{"sha":"909eba728436ac9948bce2a457c3cd89d60ff3f2","date":"2026-06-03","summary":"feat: implement migration to fetch missing MusicBrainz recording ISRCs","message":"feat: implement migration to fetch missing MusicBrainz recording ISRCs\n\n- Added `FetchMissingRecordingIsrcs` custom migration to identify and backfill recordings missing entries in the ISRC cache table.\n- Integrated `MusicBrainzService` to fetch recording details for identified IDs and updated the local cache using `MusicBrainzCacheService`.\n- Implemented progress tracking and logging to monitor the migration's status and results.\n- Added `FetchMissingRecordingIsrcsTest` to verify the migration logic across supported database dialects using mocked services."},{"sha":"4be04184066dc97a4fa38108b3f45227da76b3bb","date":"2026-06-04","summary":"feat: add support for AAC audio format in transcoding and downloads","message":"feat: add support for AAC audio format in transcoding and downloads\n\n- Introduced `AudioFormat` enum (OPUS, AAC) and `TranscodedVersion` data class to track both bitrate and codec.\n- Updated `ISongService` methods `downloadSong` and `getDownloadSize` to accept a target `AudioFormat`.\n- Refactored `AudioUtils` from `transcodeFlacToOpus` to a generic `transcodeAudio` method supporting multiple formats and containers (Ogg/Opus and MP4/AAC).\n- Enhanced `AutoTranscodeWorker` to support scheduled AAC transcoding via the new `audio.autoTranscodeAac` configuration.\n- Added a database migration to include a `format` column in the `transcodedSong` table and updated the primary key to include the format.\n- Updated Rust bridge bindings and RPC documentation to reflect the new parameters and data structures.\n- Updated unit tests to verify AAC transcoding logic and metadata handling."},{"sha":"26bacbae85ac693b0774f3e38974ffc5abe4c2c5","date":"2026-06-04","summary":"feat: add transcoding statistics to server stats","message":"feat: add transcoding statistics to server stats\n\n- Added a `fileSize` column to `TranscodedSongTable` to track the disk usage of transcoded audio versions.\n- Implemented a Flyway migration and a custom migration to backfill file size data from disk for existing transcoded files.\n- Updated `ServerStatsService` to aggregate transcoding metrics, providing a breakdown of count and total size grouped by audio format and bitrate.\n- Enhanced `AudioUtils` to automatically record the file size when inserting or updating transcoded song records.\n- Updated `ServerStats` models in both Kotlin and Rust to include the new `transcodeStats` field.\n- Updated server validation tests to reflect changes in the `ServerStats` data structure."},{"sha":"5cef88bac89946a6f67a9046d558df775cd86f9b","date":"2026-06-05","summary":"feat: improve MusicBrainz metadata fulfillment and recording synchronization","message":"feat: improve MusicBrainz metadata fulfillment and recording synchronization\n\n- Added a `FulfillIncompleteRecordings` custom migration to identify and populate cached recordings missing artist credits, titles, or duration data.\n- Updated MusicBrainz API request parameters to include `isrcs` and `media` information across release and recording lookups.\n- Refactored `CachedMusicBrainzService` search methods to ensure full entity details are fetched and cached immediately following a successful search.\n- Updated `SongService` to utilize `cachedMusicBrainzService` for recording lookups, replacing manual database inserts of incomplete records with proper metadata fulfillment.\n- Expanded API include parameters for artist and release group lookups to ensure consistent data availability for nested entities."},{"sha":"9b5b69c912ada6132d6a35cc9287ca22ef93c002","date":"2026-06-07","summary":"feat: implement MusicBrainz cache fulfillment migration","message":"feat: implement MusicBrainz cache fulfillment migration\n\n- Added `FulfillIncompleteMusicBrainzCache` as a custom migration to identify and repair incomplete database records for MusicBrainz releases and recordings.\n- Implemented detection logic for incomplete releases (missing titles or media) and incomplete recordings (missing artist credits, titles, or duration).\n- Integrated `MusicBrainzService` and `MusicBrainzCacheService` to fetch missing metadata and update the local cache.\n- Included progress tracking and detailed logging to monitor the migration status and provide a summary of updated entities."},{"sha":"4cb05600a1749ac7aa7e32ec08fdac469d249329","date":"2026-06-09","summary":"feat: enhance PostgreSQL full-text search logic and add GIN indices","message":"feat: enhance PostgreSQL full-text search logic and add GIN indices\n\n- Refactored PostgreSQL search in `Query.kt` to support both positive and negative (prefixed with `-`) search tokens.\n- Improved search precision by matching tokens against individual columns rather than a single concatenated vector.\n- Updated the ranking algorithm to aggregate `ts_rank` scores across all positive tokens per column.\n- Added query normalization for PostgreSQL to strip special characters before tokenization.\n- Introduced a new Flyway migration (`V1_46`) to create GIN indices on `to_tsvector` expressions for several tables, including `song`, `artist`, `album`, and various MusicBrainz metadata tables."},{"sha":"8f6043df73101275db5f5b742f29270e2cb3a86b","date":"2026-06-09","summary":"feat: implement asynchronous full-text search indexing using PostgreSQL tsvector","message":"feat: implement asynchronous full-text search indexing using PostgreSQL tsvector\n\n- Added `search_vector` columns and GIN indexes to `song`, `album`, and `artist` tables to optimize search performance.\n- Implemented PostgreSQL database triggers to automatically queue entities for re-indexing whenever metadata or relationships (e.g., artists, aliases, MusicBrainz IDs) are modified.\n- Introduced `SearchIndexWorker`, a background service that processes the indexing queue and rebuilds weighted search vectors using aggregated metadata.\n- Updated `rankedSearch` in `Query.kt` to utilize pre-computed search vectors, reducing on-the-fly computation during queries.\n- Refactor pagination logic in `AlbumService` and `ArtistService` to use ID-based subqueries, improving performance and accuracy for complex joined queries.\n- Added `TsVectorColumnType` to support PostgreSQL-specific `tsvector` types within the Exposed framework.\n- Added integration tests to verify the end-to-end flow of database triggers, queue processing, and vector-based search results."},{"sha":"10961b925ec4fe0023596e7ef56cd0c80cd1ec96","date":"2026-06-09","summary":"feat: implement search index rebuild worker and enhance indexing visibility","message":"feat: implement search index rebuild worker and enhance indexing visibility\n\n- Introduced `SearchIndexRebuildWorker` to handle full re-indexing by queueing all existing songs, albums, and artists into the `SearchIndexQueueTable`.\n- Added `SEARCH_INDEX_REBUILD_WORKER` to `TaskKeys` and registered it as a manually triggered task in `ScheduledTaskConfigurationService`.\n- Updated `SearchIndexWorker` to use `logTask` for better visibility and implemented progress reporting during batch processing.\n- Added a `RebuildSearchIndex` custom migration to trigger the new rebuild worker during the 2.8 database migration.\n- Refactored `SearchIndexWorker` to inherit from `KoinComponent` to support task logging utilities."},{"sha":"0aeb4a519b11b09a832a951d936c9f2270f77026","date":"2026-06-09","summary":"feat: enhance search index with MusicBrainz metadata and relationships","message":"feat: enhance search index with MusicBrainz metadata and relationships\n\n- Updated the full-text search (FTS) vector generation for artists to include group/member names and MusicBrainz metadata (names, aliases, and disambiguation).\n- Expanded the album FTS vector to include artist aliases, group/member names, and MusicBrainz release/artist details.\n- Introduced a custom migration to trigger a full search index rebuild using `SearchIndexRebuildWorker`.\n- Added a unit test to verify that the search index worker correctly queues existing artists, albums, and songs for re-indexing."},{"sha":"a4c01afcdd38abf8d439a09e6d8fdfc04c1a6636","date":"2026-06-11","summary":"feat: implement ISRC and barcode-based provider enrichment","message":"feat: implement ISRC and barcode-based provider enrichment\n\n- Added `getAlbumByBarcode` to `IMetadataService` and implemented the method across Apple Music, Deezer, MusicBrainz, Spotify, and Tidal providers.\n- Implemented `getTrackByIsrc` for the `DeezerService` metadata provider.\n- Introduced `IsrcProviderEnrichmentWorker`, a new background task that automatically resolves streaming links for songs and albums using ISRC and barcode metadata.\n- Added `ProviderEnrichmentCheckTable` and a corresponding database migration to track enrichment status and manage periodic re-checks.\n- Enhanced the base `Worker` class to support `runParallel` execution using Kotlin `Flow` for more efficient, memory-conscious data processing.\n- Updated `AlbumService` and `SongService` with logic to identify entities needing enrichment and to upsert found provider URLs.\n- Updated Rust bridge bindings and RPC definitions to include the new `getAlbumByBarcode` functionality."},{"sha":"0c67329deec4bdae96b112cf821da4d341af76f1","date":"2026-06-16","summary":"feat: implement support for animated covers and motion album art","message":"feat: implement support for animated covers and motion album art\n\n- Added `AnimatedImage` and `InsertableAnimatedImage` models alongside the `IAnimatedImageService` interface to support managing looping video covers.\n- Implemented `AnimatedImageService` to handle file persistence, content hashing, deduplication, and automatic first-frame image extraction using `JavaCV` (FFmpeg).\n- Created `AnimatedImageTable` and added the corresponding Flyway migration `V1_50__AddAnimatedImages`.\n- Integrated `IAnimatedImageService` into RPC and REST routing, configuring animated image binary responses with `ContentType.Video.MP4`.\n- Updated `StorageService` and `IServerStorageService` to configure a dedicated storage location via the `DATA_ANIMATED_IMAGES_PATH` environment variable.\n- Added optional Redis caching for animated cover bytes, controlled by the newly introduced `REDIS_CACHE_ANIMATED_IMAGES` property.\n- Added Rust bridge bindings for the new animated image models and service endpoints.\n- Updated `RPC_SERVICES.md` and `ENVIRONMENT_VARIABLES.md` to document the new APIs, data schemas, and configuration properties."},{"sha":"c03ddf4006c59fdcce810b823cb478d529bdb1c2","date":"2026-06-16","summary":"feat: implement animated cover support for songs and albums","message":"feat: implement animated cover support for songs and albums\n\n- Added `animatedCover` reference columns mapping to `AnimatedImageTable` in both `AlbumTable` and `SongTable`.\n- Included a new Flyway migration (`V1_51__AddAnimatedCoverToSongAndAlbum`) to apply the schema changes.\n- Implemented `ImportAlbumAnimatedCovers` custom migration to automatically find existing Tidal albums and backfill missing animated covers.\n- Enhanced `TidalBaseImporter` to extract, download, and persist animated covers for songs and albums during the track import process.\n- Updated `TrackMetadata` model in the Tidal importer to track `animatedCoverUrl` and `tidalAlbumId` to facilitate batch database updates."},{"sha":"f2ab260ab6e78cd65233717ffcadd488c130105a","date":"2026-06-26","summary":"feat: use parsed MusicBrainz relations to resolve alternative import URLs","message":"feat: use parsed MusicBrainz relations to resolve alternative import URLs\n\n- Added `MBRelationProviderTable` to store structured data (provider, external ID, type, and raw URL) extracted from MusicBrainz entity relations.\n- Added Flyway migration `V1_52` and custom migration `PopulateMBRelationProviderTable` to create the new table and backfill it with parsed URLs from existing `MBRelationTable` records.\n- Refactored `MusicBrainzCacheService` to use a shared `cacheRelations` method that automatically parses and persists relationships into both `MBRelationTable` and `MBRelationProviderTable` during cache updates.\n- Implemented `relationSiblingUrls` in `MusicBrainzCacheService` to query all alternative URLs associated with the same MusicBrainz entity.\n- Enhanced `ImporterProxy` to query cached MusicBrainz sibling URLs when attempting to resolve a compatible importer before falling back to the external `LinkResolverService`.\n- Updated `ImporterProxyTest` and `ImporterPriorityTest` to inject the new `MusicBrainzCacheService` dependency."},{"sha":"b7f8f71300d213a0e56cbfa2eabc441adeb2a4bf","date":"2026-06-26","summary":"feat: implement user collections for grouping songs, albums, artists, and playlists","message":"feat: implement user collections for grouping songs, albums, artists, and playlists\n\n- Added `Collection`, `InsertableCollection`, and `CollectionItemType` data models to `common-rpc` to represent user-owned, downloadable collections.\n- Introduced the `ICollectionService` RPC interface to handle collection CRUD operations, item management, and entity ID streaming, and regenerated the corresponding Rust bridge bindings.\n- Created database schema definitions for `CollectionTable` and relational item tables (`CollectionSongTable`, `CollectionAlbumTable`, `CollectionArtistTable`, `CollectionPlaylistTable`), alongside the `V1_53` Flyway migration script.\n- Implemented `CollectionService` and `RpcCollectionService` to handle database interactions, including advanced statistics computation that recursively resolves albums, artists, and playlists into deduplicated total song counts and file sizes.\n- Registered the new collection services in the Koin dependency injection module and the RPC/REST routing registries.\n- Added comprehensive unit tests in `CollectionServiceTest` to verify CRUD functionality, item deduplication, complex nested statistics aggregation, and foreign key cascade deletions."},{"sha":"111d561feba97a12b2afd97d1f47045760420a4a","date":"2026-06-29","summary":"feat: fetch and cache MusicBrainz URL relations for artists","message":"feat: fetch and cache MusicBrainz URL relations for artists\n\n- Added `relations` property to the `MusicBrainzArtist` data model and its corresponding Rust bridge struct.\n- Updated `MusicBrainzService.fetchArtistById` to include `url-rels` in the `inc` query parameter to fetch external artist links.\n- Enhanced `MusicBrainzCacheService` to query `MBRelationTable` and populate relations when retrieving an artist from the cache.\n- Updated caching logic in `MusicBrainzCacheService` to persist artist relations to the database, adding an early return for null relations.\n- Reordered `MusicBrainzRelation`, `MusicBrainzRelationUrl`, and `MusicBrainzReleaseGroup` structs in the Rust bridge to ensure proper compilation and serialization order."},{"sha":"e36402377fd96444761f1ff764ef61bc0d06c894","date":"2026-07-03","summary":"feat: implement credited artist names and editable song metadata","message":"feat: implement credited artist names and editable song metadata\n\n- Updated `SongArtistTable` and `AlbumArtistTable` with a `creditedAliasId` column referencing `ArtistAliasTable`, and added the `V1_54__ArtistCreditedAlias` database migration.\n- Introduced the `PopulateCreditedArtistNames` custom migration to automatically backfill credited artist names for existing songs and albums using cached MusicBrainz credit data.\n- Enhanced `SongService` and `AlbumService` with table aliases and left joins to correctly extract and map credited artist names during database queries.\n- Updated MusicBrainz metadata fetching in `SongService` and `AlbumService` to resolve, create, and persist credited artist aliases using the new `getOrCreateAliasTx` method in `ArtistService`.\n- Added `updateSong` to the `ISongService` RPC interface and implemented it in `SongService` to allow updating editable metadata (title, artists, release date, lyrics, track/disc number) and to persist changes to FLAC audio tags.\n- Added comprehensive unit tests in `PopulateCreditedArtistNamesTest` and `SongCreditedNameTest` to verify the migration backfill logic and the resolution of canonical versus credited artist names."},{"sha":"e6b68fb2a881663b592e36516a7efa7d0a7c84e5","date":"2026-07-03","summary":"feat: implement RPC call usage metrics collection and API","message":"feat: implement RPC call usage metrics collection and API\n\n- Added `RpcCallTotal`, `RpcCallStat`, and `RpcCallEvent` data models to represent RPC usage statistics and recent invocation events.\n- Introduced `IRpcMetricsService` with admin-only endpoints for querying lifetime totals, hourly time-series data, and recent invocation logs.\n- Created `RpcCallTotalsTable`, `RpcCallStatsTable`, and `RpcCallEventTable` along with the corresponding `V1_55` database migration to persist metrics.\n- Implemented `RpcMetricsCollector` to efficiently buffer method invocations in-memory and periodically flush aggregated batch data to the database via a background coroutine in `Application`.\n- Added a `withMetrics` Java Proxy wrapper in `Metrics.kt` to dynamically intercept interface methods and record invocation usage, integrating it into `RpcRegistry` to automatically wrap all registered services.\n- Added `METRICS_ENABLED`, `METRICS_FLUSH_INTERVAL_SECONDS`, and `METRICS_EVENT_LOG_RETENTION_HOURS` environment variables to `application.yaml`, `example.env`, and documentation.\n- Added comprehensive unit tests in `RpcMetricsCollectorTest` to verify data aggregation, flushing logic, and disabled states.\n- Regenerated Rust bridge bindings in `lib.rs` to support the new metrics data models and RPC service endpoints."},{"sha":"27e98bc5a4a23d7ee07ca417c421803886a83dff","date":"2026-07-07","summary":"Implement audio embedding and recommendation services","message":"Implement audio embedding and recommendation services\n\nAdded support for per-song audio embeddings using MusiCNN and integrated a recommendation system based on embeddings. New environment variables and tasks were introduced for managing audio embedding and recommendation training workflows. Plugins were updated for compatibility, and database migrations were implemented to support the new functionality."},{"sha":"55a063369daf59c1cf386bef25f1f92c6628b83f","date":"2026-07-08","summary":"Refactor ListenBrainz service to improve synchronization, add unmatched listen rematching, and enrich metadata handling","message":"Refactor ListenBrainz service to improve synchronization, add unmatched listen rematching, and enrich metadata handling\n\n- Added new database migration `V1_59__StoreAllListens` to enhance `ListenTable` structure for storing Recording MBIDs, Release MBIDs, artist MBIDs, and enriched metadata fields (track name, artist name, release name), with updated indices.\n- Updated sync logic to fetch and store richer listen metadata, including retry functionality for failed pages.\n- Implemented unmatched listen rematching using `rematchUnmatched` to resolve previously unlinked listens.\n- Improved logging and progress updates during sync, distinguishing unmatched and matched listens.\n- Enhanced resilience of fetch operations with retry logic and dynamic delays.\n- Updated schema, ingestion logic, and affected components in `ListenBrainzService`, `RecommendationService`, and `RecommendationServingService` to leverage enriched metadata storage."},{"sha":"b1f088b82104e52df558d1e2c021bc45936cb68b","date":"2026-07-08","summary":"Consolidate `V1_56__AddListenTables` and `V1_59__StoreAllListens` migrations into `V1_59__AddListenTables` for streamlined listen table creation logic","message":"Consolidate `V1_56__AddListenTables` and `V1_59__StoreAllListens` migrations into `V1_59__AddListenTables` for streamlined listen table creation logic"},{"sha":"845a233d98b4f101f1a667a0f6988bd6c2afa9f4","date":"2026-07-08","summary":"Add lastUpdate field to RecentRelease and update workflows","message":"Add lastUpdate field to RecentRelease and update workflows\n\nImplemented logic to track and manage last updates for recent releases in the database. Adjusted processes such as refreshing and fetching new releases to ensure proper cooldown and refresh windows. Added extensive test cases to cover new features and edge scenarios."},{"sha":"85838dff6c98bde0154db2c481c4920a7500beca","date":"2026-07-09","summary":"Add scrobbling functionality to track user playback","message":"Add scrobbling functionality to track user playback\n\nIntroduced ScrobbleService and related models to handle scrobbling features like now-playing state and recent listens. Integrated scrobble handling into services, database migrations, RPC registry, and tests. This enables recording and streaming user playback data with accurate deduplication and session management."},{"sha":"8bacbbc92817a013ec363e115187d727dc5929cd","date":"2026-07-09","summary":"Add migration for ISRC enrichment and implement ISRC-based deduplication","message":"Add migration for ISRC enrichment and implement ISRC-based deduplication\n\n- Introduced `V1_62__AddIsrcsToListen` migration to add `isrcs` column to `ListenTable`.\n- Implemented backfill process to populate ISRCs for existing listens using `recordingMbid`.\n- Enhanced listen deduplication logic to consider ISRCs for reducing duplicate entries.\n- Updated related services (`ListenService`, `RecommendationService`) and ingestion workflows to leverage ISRC data for metadata enrichment.\n- Added comprehensive tests to verify ISRC handling, deduplication, and metadata enrichment functionality."},{"sha":"3a1cfc6714a6f93c4d59a7a3b6852abedeb7aa92","date":"2026-07-10","summary":"Add image analysis retry mechanism and enhance recovery handling","message":"Add image analysis retry mechanism and enhance recovery handling\n\n- Introduced `V1_63__AddImageAnalysisState` migration to track `lastAnalysisAttempt` and `analysisUnrecoverable` in `ImageTable`.\n- Updated image analysis workflow to retry failed attempts after a configurable interval while marking unrecoverable cases based on origin classification.\n- Added `recoverImageBytes` to restore missing images from origin data (URL or audio file), improving resilience in analysis.\n- Enhanced automated testing to cover recovery, retry, and edge case scenarios.\n- Updated `ImageAnalysisWorker` to monitor processed count during image analysis tasks."},{"sha":"c02016a995ac1fb323478d1ed6dcf880333251c6","date":"2026-07-15","summary":"Add API key management and radio streaming services","message":"Add API key management and radio streaming services\n\nImplemented API key services for authentication and radio-based station functionalities. Includes data models, database schema changes, service definitions, migrations, routes, and thorough tests for both API keys and radio features."},{"sha":"c1f165085e45b56be04d7d98237cb5e08d773948","date":"2026-07-16","summary":"Add radio channel management, streaming, and related services","message":"Add radio channel management, streaming, and related services\n\nIntroduce `RadioChannel` for admin-curated radio content and `IRadioChannelService` for API interaction. Implement database tables, migrations, service logic, and tests. Extend streaming routes to support channel playback."},{"sha":"d94b666dfae233e241803712c41ff09ebe370db8","date":"2026-07-16","summary":"Add migration to unlink images of unfollowed artists","message":"Add migration to unlink images of unfollowed artists\n\nIntroduced a migration that unlinks cover images from recent releases of unfollowed artists and removes any unreferenced images. Includes corresponding unit tests to ensure proper functionality and edge case handling."},{"sha":"294b6fcc3a4d0929ef13f3507f31e742002c5608","date":"2026-07-16","summary":"Add Subsonic service support with routes and API key scopes migration","message":"Add Subsonic service support with routes and API key scopes migration\n\nIntroduce the Subsonic service with comprehensive routes, including playlist management, song querying, and lyric search. Integrate API key scope updates to ensure proper permission handling, and register the SubsonicPlugin in the PluginManager."},{"sha":"552c3ac6f7fbf572e29ab93e1ce8135a6fb0dba6","date":"2026-07-17","summary":"Add raw key storage and AAC streaming with ICY support","message":"Add raw key storage and AAC streaming with ICY support\n\nIntroduced `rawKey` storage in API keys and updated related services to handle retrieval securely. Upgraded radio streaming to use AAC (ADTS) format with ICY metadata for improved compatibility and metadata support. Includes tests for the new functionalities and adjustments to API documentation."},{"sha":"c9e5fbfa30a1e8638b0d89f9de460e20bb47e627","date":"2026-07-18","summary":"Add listening stats service and related database features","message":"Add listening stats service and related database features\n\nIntroduced a new listening statistics service for unified listen history analysis, including API endpoints and data models. Added database migration for release group cover table and indexing. Updated tests, services, and image references to support the new feature."},{"sha":"34d8aafc8422ee364432d56c0509b8da5917e392","date":"2026-07-18","summary":"Add ListenLinkTable and enhance listening stats management","message":"Add ListenLinkTable and enhance listening stats management\n\nIntroduce ListenLinkTable migration and integrate recording MSIDs for linking unmatched listens. Added manual mapping submission to ListenBrainz and updated services/tests for improved track linking and stats handling."},{"sha":"63408d1e2ed1562967f3993f4b184c8602e04a04","date":"2026-08-23","summary":"feat: Add PCM analysis worker and integrate lossless audio format handling","message":"feat: Add PCM analysis worker and integrate lossless audio format handling\n\n- Introduced `PcmAnalysisWorker` for analyzing WAV/AIFF files with scheduled tasks.\n- Updated `ScheduledTaskConfigurationService` to include PCM analysis task.\n- Enhanced `SoundcloudService` and `YoutubeService` to utilize configurable lossless audio formats.\n- Implemented audio format checks in `SubsonicMapper` and `SubsonicMediaRoutes` for AIFF support.\n- Refactored audio file processing in `TidalIndexer` and `YoutubeIndexer` to use a unified audio check.\n- Added tests for new PCM analysis service and lossless format handling.\n- Updated application configuration to support dynamic lossless format settings.\n- Enhanced existing tests to cover new functionalities and ensure backward compatibility."},{"sha":"0797e90a121a65e15bdc10129cd73b3064f5a71f","date":"2026-08-27","summary":"add audioStartMs to songs with backfill migration and post-index analysis","message":"add audioStartMs to songs with backfill migration and post-index analysis; add client-compat response shaping infrastructure"},{"sha":"f0a3f8886eb7b3c0cfeaaf776f68edc20dc338d3","date":"2026-08-28","summary":"add listen backup: push server-side listens to a standalone listen-backup receiver","message":"add listen backup: push server-side listens to a standalone listen-backup receiver\n\n- updatedAt on listens (V1_75 + backfill migration) for change detection\n- ListenBackupService with admin RPC/REST config, connection test, cursor reset\n- ListenBackupWorker scheduled task\n- new listen-backup receiver tool and common-listen-backup wire models\n- Dockerfile, compose file, CI and docs"},{"sha":"59c00c0e31fc000c597e449e67eac837ebe49e22","date":"2026-08-28","summary":"add Dolby Atmos support for Tidal imports","message":"add Dolby Atmos support for Tidal imports: convert E-AC-3 downloads to 5.1 lossless, keep .atmos.m4a variant, expose atmosPath and streamSongAtmos (API v3); decode >16-bit sources in float for lossless conversion"},{"sha":"1640a3a3e24784c26143c2cb51b7b0a6128be3cf","date":"2026-08-28","summary":"scale transcode bitrate by channel pairs for multichannel sources","message":"scale transcode bitrate by channel pairs for multichannel sources; add RetranscodeMultichannelSongs custom migration; synthesize E-AC-3 test fixture instead of relying on a local download"},{"sha":"aa7a09376adca7b46291320aa41c69ea15ff340b","date":"2026-08-28","summary":"nest song file properties in AudioInfo (audio/atmos) for API v4","message":"nest song file properties in AudioInfo (audio/atmos) for API v4: song_variant table, channels column, AudioProbe, BackfillSongAudioInfo migration, per-feature CompatRules for v3 shaping"},{"sha":"c61b064c4ab1cea4021d13957d4e8cdd0c778b75","date":"2026-08-28","summary":"report bit rates in kbps consistently: AudioProbe, Subsonic mapping, NormalizeVariantBitRate migration","message":"report bit rates in kbps consistently: AudioProbe, Subsonic mapping, NormalizeVariantBitRate migration; backfill variants first and log probe failures"},{"sha":"b8cbbda959a3202dc31920e7fb245400cdadf866","date":"2026-08-29","summary":"add server-driven UI: IUiService with slots, pages, home cards, hooks and live value streams","message":"add server-driven UI: IUiService with slots, pages, home cards, hooks and live value streams; plugin API v2 (IUiPlugin, settings, translations); translation, settings and home-card services with migration; iOS-style importer page with queue and settings pages, gamdl credentials section; UI schema compat shaping; mock fixtures; client guide docs"},{"sha":"a92125c4bb7395be6992320f750f0134932c0034","date":"2026-09-05","summary":"generated playlist/collection covers and Philips Hue integration","message":"generated playlist/collection covers and Philips Hue integration: CoverGenerationService with asset packs, collage renderer, auto trigger and backfill worker, imageSource/coverStyle/coverSeed columns (V1_79); HueService with bridge pairing, throttled CLIP v2 commands, palette mapping and settings UI; song audio timeline table with beat grid and RMS envelope plus backfill worker (V1_80); NowPlayingChanged and CollectionChanged hooks; listHookHandlers and SSL confirmation members for the updated common-rpc; SFW cover asset packs"},{"sha":"02cafa9ad6cdbee9d2d914cbc70e2b9af022339f","date":"2026-09-05","summary":"ambient Hue light movement: HueMotionMode SLOW/TEMPO with palette rotation and loudness-envelope brightness per link (V1_81)","message":"ambient Hue light movement: HueMotionMode SLOW/TEMPO with palette rotation and loudness-envelope brightness per link (V1_81); enum columns for Hue link, audio timeline and cover source/style; fill title placeholders in listHookHandlers via IntakeResolver.
