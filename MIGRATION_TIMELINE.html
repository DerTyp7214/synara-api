titleArgs"},{"sha":"657bcf24503bd7950c38beadcbd1cdc9ff801b39","date":"2026-09-05","summary":"collage grids never repeat a tile: explicit MOSAIC/GRID fall back to GRID/STACKED when tiles cannot fill every cell, custom migration 3.14 re-rendering generated covers","message":"collage grids never repeat a tile: explicit MOSAIC/GRID fall back to GRID/STACKED when tiles cannot fill every cell, custom migration 3.14 re-rendering generated covers; spacer above the Hue link form actions"},{"sha":"7de537db3c671c6ccf142c7da2063e7e1ab9d80f","date":"2026-09-05","summary":"beat- and position-aware Hue motion: reportPlayback RPC with transport-delay corrected playback clock and position/playing on NowPlayingChanged","message":"beat- and position-aware Hue motion: reportPlayback RPC with transport-delay corrected playback clock and position/playing on NowPlayingChanged; per-song light score (beat grid, downbeat phase, sections, normalized envelope) with a clock-driven scheduler that resyncs on seek/pause and paces frames to CLIP limits; per-link latencyMs (V1_82); common-rpc pointer bump"},{"sha":"1d5300579ecbb8fb0603274797430a6fc3c8d500","date":"2026-09-06","summary":"Hue BASS motion mode: FFT bass-band envelope (30-150 Hz, radix-2 FFT per 100 ms window) stored next to the loudness envelope (V1_83, timeline version 2), backfill worker refreshes…","message":"Hue BASS motion mode: FFT bass-band envelope (30-150 Hz, radix-2 FFT per 100 ms window) stored next to the loudness envelope (V1_83, timeline version 2), backfill worker refreshes stale envelopes without rerunning Essentia, light score takes the peak bass level after each beat with a 30 % brightness floor while bar and section timing stay on the beat grid; common-rpc pointer bump (bassEnvelopeDb, HueMotionMode.BASS)"},{"sha":"a943db58d67051459f3463beccde38770f6e6491","date":"2026-09-07","summary":"Hue SCENE stop mode replaces RESTORE: scenes recalled per room/zone through the command queue with the link transition as fade (CLIP v2 scene recall, sealed HueCommand with…","message":"Hue SCENE stop mode replaces RESTORE: scenes recalled per room/zone through the command queue with the link transition as fade (CLIP v2 scene recall, sealed HueCommand with HueLightCommand/HueSceneCommand), listScenes with a cached room/zone map, one scene picker per room/zone on the settings page, stopScenes column (V1_84) and RESTORE links migrated to KEEP (custom 3.15); common-rpc pointer bump (HueStopMode.SCENE, HueScene, stopScenes, listScenes)"},{"sha":"f78e4569bb69659ff4f507272a2e0f53f1683501","date":"2026-09-07","summary":"Hue bridges per user (createdBy becomes userId owner, unique per user and hardware id, V1_85 plain SQL + custom 3.16 clones bridges for other linked users, removeBridge by…","message":"Hue bridges per user (createdBy becomes userId owner, unique per user and hardware id, V1_85 plain SQL + custom 3.16 clones bridges for other linked users, removeBridge by ownership), rooms/zones expand into member color lights with the palette spread across them, gradient lights get multi-point gradients, entertainment areas streamed over DTLS-PSK (Bouncy Castle 1.85, HueStream v2 encoder, renderer with crossfades and beat pulses, 25 fps session, ENTERTAINMENT target with one area per link), audio timeline backfill without the 2000 cap under a 6 h budget, cover asset packs bundled in the Docker image; common-rpc pointer bump (HueTargetType.ENTERTAINMENT, removeBridge without RequiresAdmin)"},{"sha":"adc57cc3cf07dc6d5fdaaecbaf945f485ba1e154","date":"2026-09-08","summary":"Hue BASS mode on 5-band 50 Hz level tracks","message":"Hue BASS mode on 5-band 50 Hz level tracks: 80 ms Hann STFT extractor (sub/kick/low-mid/mid/high, planar BLOB + bandHz/bandCount, V1_86, timeline version 3 so the backfill worker refreshes every track without Essentia), legacy bassEnvelope derived from sub+kick, light score driven by kick-band onset strength normalised over the trailing 8 bars with a kick-to-loudness track gain, sub band moves the per-keyframe floor 0.30-0.55 (Keyframe.floor, entertainment pulse decays to it), v2 rows keep the old peak path; common-rpc pointer bump (AudioBand, SongAudioBand, bandHz/bands)"},{"sha":"bfe78b24251827eae6e749817cbf34e8fab758e4","date":"2026-09-09","summary":"Song title tags: version markers (remix, mix, live, cover, acoustic, instrumental, edit, version, remaster, demo, feat., prod.) split off song titles into Song.tags, title_tags…","message":"Song title tags: version markers (remix, mix, live, cover, acoustic, instrumental, edit, version, remaster, demo, feat., prod.) split off song titles into Song.tags, title_tags column (V1_87, search trigger also fires on tag changes), custom 3.17 backfill keeping the explicit marker, createBatch/updateSong/upsertSong/mirror normalise incoming titles, dedup and library merge key on tags, tsvector and Redis index tag labels, TitleTagsCompat re-appends tags to the title for clients below API version 6, full title for Subsonic/ICY/playlist/stats/listen names/CSV, findSongIdByMetadata and merge lookups use chained andWhere; common-rpc pointer bump (TitleTag, TitleTagKind, Song.tags, splitTitleTags, fullTitle, ApiVersion 6)"},{"sha":"079c3d46bf88dbd9ad313546bdb97bab95e1dce2","date":"2026-09-10","summary":"Server-stored per-user play queue for cross-client queue management","message":"Server-stored per-user play queue for cross-client queue management: userQueue/userQueueEntry/queueSyncDevice tables (V1_88), QueueService with monotonic version + modifiedAt/modifiedBy, baseVersion-checked writes returning Conflict unless forced, paginated getQueue (songs only with includeSongs), chunked begin/page/commit upload with in-memory staging and expiry, insert/remove/move/setCurrentIndex/setModes delta ops in the active order, original and shuffled order both persisted (position + shuffledPosition), per-user observe flow, per-session sync opt-in and device list, ClientRequestService as general server-to-client request channel (UploadQueue awaited with timeout, requestUploadFrom restricted to own sessions), QueueCleanupWorker clears entries of queues untouched for 30 days while bumping the version, session cleanup drops queue sync devices, compat shaper handles QueueItem; common-rpc pointer bump (IQueueService, IClientRequestService, TaskKeys.QUEUE_CLEANUP)"},{"sha":"d860c2d04b07335ae8a880c70970d1e24689b2b0","date":"2026-09-12","summary":"Server-stored client settings, device scoped with optional cross-device sync and versioned","message":"Server-stored client settings, device scoped with optional cross-device sync and versioned: clientDevice/clientSettingScope/clientSetting/clientSettingHistory tables (V1_89), ClientSettingsService with opaque JSON string values validated strictly, SYNCED and DEVICE scopes keyed by a client-generated stable deviceId, monotonic version per scope, all-or-nothing batch writes with per-key baseVersion conflicts unless forced, tombstones for deletes, getChanges with hasMore paging and fullResync once purged tombstones are older than the requested version, last 20 superseded values per key with restore through the normal write path, per-user observe flow, device registry refreshed by device-scope reads/writes and getSnapshot, deleteDevice drops device settings and history, ClientSettingsCleanupWorker purges tombstones after 30 days and devices unseen for 180 days, RpcClientSettingsService with kRPC/REST registration, docs/CLIENT_SETTINGS.md; scheduled task configurations and grouped task logs sorted case-insensitively by name; tests for service, RPC adapter, cleanup and task sorting; common-rpc pointer bump (IClientSettingsService, ClientSettings models, TaskKeys.CLIENT_SETTINGS_CLEANUP)"},{"sha":"16520bfd67f6f5ad32107971233c62a3477b59af","date":"2026-09-13","summary":"Per-user timecode tags on songs: timecodeTag table (V1_90) keyed by user and song with type CHAPTER/MARKER/NOTE, text, timestampMs, optional endMs and createdAt/updatedAt…","message":"Per-user timecode tags on songs: timecodeTag table (V1_90) keyed by user and song with type CHAPTER/MARKER/NOTE, text, timestampMs, optional endMs and createdAt/updatedAt, TimecodeTagService with private ownership on every query, validation of position, end and text length, at most 500 tags per user and song guarded by a per-user mutex, getTags ordered by position, updateTag/deleteTag limited to own tags, atomic replaceTags per song in one transaction, paginated listTags across songs newest first with optional type filter, RpcTimecodeTagService with kRPC/REST registration; tests for service on both dialects and RPC adapter; common-rpc pointer bump (ITimecodeTagService, TimecodeTag models)"},{"sha":"969eb7e70fb575315864ec44241af8d7588a8f82","date":"2026-09-16","summary":"Podcast support as a media type separate from songs","message":"Podcast support as a media type separate from songs: podcastShow/podcastEpisode/podcastTranscript/podcastSubscription/podcastEpisodeProgress tables (V1_91), per-user subscriptions to shared FEED shows or LOCAL library folders, PodcastFeedParser (StAX, RSS 2.0 + iTunes + Podcasting 2.0 transcripts, Atom fallback, DTD/external entities disabled), PodcastFeedService with conditional GET, artwork, new-feed-url and synchronous subscribe/refresh, PodcastLocalScanService over PODCASTS_LIBRARY_PATH with sidecar and embedded-lyrics transcripts, PodcastImportService streaming enclosures to PODCASTS_IMPORTS_PATH via .part files with retries and stale recovery, PodcastMaintenanceService queueing imports per keepEpisodes, enforcing retention and purging shows orphaned for 7 days, PodcastRefreshWorker (hourly) and PodcastImportWorker (every 15 min), PodcastService with per-user last-writer-wins playback progress (auto-complete within 30 s or 5 %), observe flow, browse/search over podcast tables only, transcripts fetched once and cached, explicit dependent-row deletes, PodcastStreamService serving imported/local files or relaying the origin behind the single streamEpisode entry point, RpcPodcastService with kRPC/REST registration, PodcastHttp with SSRF guard, StorageCategory.PODCASTS and podcast counts/size in ServerStats, podcast artwork kept by image GC; RestRegistry file responses now detect the RestFileProvider through the authorization proxy and accept omitted optional parameters; tests for service, parser, feed, stream, import, scan, maintenance, probe, RPC adapter, REST file provider and capabilities on both dialects; .gitignore and .graphifyignore for graphify output; common-rpc pointer bump (IPodcastService, Podcast models, UserCapability.PODCAST_EDIT, TaskKeys.PODCAST_REFRESH/PODCAST_IMPORT, ServerStats podcast fields)"},{"sha":"425f1013b028c995190ea764653008b60d565fb1","date":"2026-09-16","summary":"Podcast retention modes: PodcastShowTable.retention (V1_92) with NEWEST keeping today's newest-N imports and UNLISTENED importing every episode not yet completed by all current…","message":"Podcast retention modes: PodcastShowTable.retention (V1_92) with NEWEST keeping today's newest-N imports and UNLISTENED importing every episode not yet completed by all current subscribers (keepEpisodes as optional cap on imported plus pending) and deleting imports once every subscriber completed or marked them played; PodcastService.unlistenedImportCandidates/finishedImportedEpisodes/importedOrPendingCount, PodcastMaintenanceService branching on retention, updateShowSettings requires IMPORT delivery for UNLISTENED; tests on both dialects; OpenAPI golden summary line updated; common-rpc pointer bump (PodcastRetention, settings/show fields, updateShowSettings docs)"},{"sha":"9737b39ae5324c79a25cf4aeb1bfb823ff9a6ec0","date":"2026-09-20","summary":"Apple Music releases for followed artists","message":"Apple Music releases for followed artists: when the catalog API is configured (AppleMusicService.catalogEnabled, storefront from APPLE_MUSIC_STOREFRONT, default us), AppleMusicReleaseService fetches every followed artist's albums from the Apple Music catalog, keeps releases of the last 180 days and up to a year ahead (pre-releases carry a future date), matches them to MusicBrainz release groups by existing link, UPC or normalized title so matched entries only gain the Apple link while unmatched ones become rows of the new provider_release table (deterministic id, links to library albums via album_provider or gamdl originalId and to songs via song_provider, artwork persisted once and counted as referenced by ImageService); AppleMusicArtistResolver maps a library artist to its Apple artist id through the persisted artist_provider link, the MusicBrainz URL relation, our own album/song provider links and gamdl ids, then UPC/ISRC catalog lookups (no name search) and stores the result in the new artist_provider table; getRecentReleases and getArtistRecentReleases merge MusicBrainz and provider rows in date order with source and upcoming flags, artists without a MusicBrainz id now get results, getReleaseImage proxies or persists Apple artwork and refreshRecentRelease re-fetches the artist for provider ids; AppleMusicReleaseWorker runs daily at 06:00 and followArtist triggers a run for that artist; AppleMusicService gains paged artist albums, albums by UPC/ids, songs by ISRC/ids and artist names on the catalog API, year-only release dates and the cached-token check before the config guard; migration V1_93; tests for the client, the resolver and the release service on both dialects, the merged feed, the worker and the schedule default; generated env docs, RPC docs and OpenAPI golden; common-rpc pointer bump (ReleaseSource, RecentRelease.source/upcoming, TaskKeys.APPLE_MUSIC_RELEASE_WORKER)"},{"sha":"193d852e6ec543373c4f1a20e5e761d45977d45e","date":"2026-09-21","summary":"Apple Music artist resolution is identity-based and Apple releases merge with MusicBrainz entries through a global link table","message":"Apple Music artist resolution is identity-based and Apple releases merge with MusicBrainz entries through a global link table: AppleMusicArtistResolver accepts an Apple artist id only from the persisted artist_provider link, the MusicBrainz URL relation, or catalog evidence tied to the library by ISRC (songs), UPC (albums) or a gamdl originalId, where a resource counts only when Apple credits at least as many artists as we do and the id is either the single credit of a sole-credit song/album or the one id shared by at least two such resources, the former acceptance of a single unverified id from album/song provider links (which handed compilations, featured credits and mis-enriched links to the wrong artist) and the name comparison of getCatalogArtistNames are gone; links of release entries move to provider_link (one row per external URL) with mapping tables recent_release_link and provider_release_link, V1_94 creates them, copies recent_release_provider into the new model and drops it, ProviderLinkService parses, stores and reads links for both sources; AppleMusicReleaseService drops title matching and matches an Apple album to a MusicBrainz release group by existing Apple link, cached UPC, a direct MusicBrainz barcode lookup (MusicBrainzService.fetchReleasesByBarcode, results cached, linked only when the group is already tracked) and the platform links the link resolver returns for the Apple url/UPC compared against the group's links and MusicBrainz URL relations, throttled per row by links_resolved_at (7 days); the MusicBrainz radar merges the other way in processReleaseGroup (unlinked Apple row of the artist matched by Apple id, barcode or shared link keys is merged and the Apple title search skipped, merged links survive a refresh, a title-search hit merges the Apple row with that album id); a merge sets releaseGroupId, attaches the Apple row's links to the group and fills the MusicBrainz entry's missing image and release date; provider feed rows expose their link-table urls; unlinkUnfollowedRecentReleaseImages also releases mzstatic artwork; custom migration ResetAppleArtistLinks (3.18) wipes Apple artist links, Apple provider releases, their link mappings and unreferenced artwork so the next worker run rebuilds them; PopulateRecentReleaseProviderTable removed and FulfillUnknownProviders no longer touches release links; tests for resolver, link service, migration copy, release merge in both directions and the reset on both dialects"},{"sha":"7730df8dcbe3ddb799b0c93a01e5eee39908685b","date":"2026-09-21","summary":"Cover Art Archive 404 pages are no longer stored or served as cover images","message":"Cover Art Archive 404 pages are no longer stored or served as cover images: HttpClient.safeGet only reads the body of a 2xx response and the new safeGetImage/safeQueuedGetImage helpers additionally require image magic bytes (ByteArray.isImage on the sniffer that moved from routing.rest to core/ContentSniffer), every still-image download (ReleaseService.fetchReleaseGroupImage, fetchCoverArtBytes and fetchProviderArtworkBytes, MetadataFetchingService, ArtistService, AppleMusicReleaseService, TidalBaseImporter, SoundcloudService, YoutubeService) uses them so a CAA miss leaves RecentReleaseTable.imageId null while lastImageFetch still records the attempt, animated video covers keep the plain queued fetch; ImageService.getImageData answers null (REST 404) for any stored or Redis-cached blob that is not an image and evicts the poisoned cache key instead of serving HTML as application/octet-stream; ImageService.purgeNonImageFiles scans image rows by origin prefix, sniffs the file header, explicitly nulls the references and cooldowns of recent_release, provider_release and mb_release_group_cover plus the no-action links of album, artist, song, playlist, user_playlist and collection, and deletes the unreferenced rows and files; custom migration PurgeNonImageCoverFiles (3.19) runs it for coverartarchive.org origins; tests for the fetch helpers, fetchReleaseGroupImage against a mocked engine, getImageData and the purge on both dialects, and the migration incl. rerun and missing-file cases"},{"sha":"c25fac798b04947d3ba88435ff7db75d40b3c3fb","date":"2026-09-21","summary":"Editors can hide release feed entries and Apple releases that may belong to a same-name artist are flagged","message":"Editors can hide release feed entries and Apple releases that may belong to a same-name artist are flagged: hidden_release (nullable references to the MusicBrainz release group or the provider release, artist, hiddenBy) is excluded from getRecentReleases and from getArtistRecentReleases unless includeHidden, ReleaseService.setReleaseHidden hides or shows an entry for everyone and with includeRelated also the artist's Apple entries sharing the copyright holder (or record label) while recording a BLOCK rule in artist_source_rule (artist, provider, kind COPYRIGHT_HOLDER|LABEL|ISRC_REGISTRANT, value, rule TRUST|BLOCK) so the next worker run hides matching entries automatically, confirmRelease clears the flag and stores TRUST rules for the entry's holder, label and ISRC registrants; AppleMusicService.CatalogAlbum parses recordLabel, copyright and genreNames and getAlbumIsrcs pages an album's track ISRCs; AppleMusicReleaseService stores recordLabel, copyright, the normalized copyrightHolder and the ISRC registrants of unmatched releases (fetched once) on provider_release and in a second pass per artist evaluates every unmatched release with ArtistIdentityEvidence (BLOCK rule > TRUST rule > foreign Apple artist credit > compilation > comparison of holder, label and registrant against the artist's library copyright tags and ISRCs, matched provider releases and TRUST rules; genre only annotates the reason) writing suspect and suspectReason, auto-hiding BLOCK hits and reporting a suspect count, mergeIntoReleaseGroup carries a hidden provider row over to the release group; artist merges re-point hides and copy rules; migration V1_95; RpcReleaseService forwards with the user id and both methods require EDIT; tests for the evidence normalization and decision table, the worker (RIN-like DistroKid scenario, evidence from matched rows, TRUST/BLOCK rules, ISRC fetch once and retry, stale flag cleared, merge copies hidden), the feed and hide/confirm semantics on both dialects, capability gates, RPC forwards, artist merge and the migration; REST goldens gain PUT /release/releaseHidden/{releaseId} and POST /release/confirmRelease/{releaseId}; RPC docs regenerated; common-rpc pointer bump (setReleaseHidden, confirmRelease, includeHidden, RecentRelease.hidden/suspect/suspectReason/recordLabel/copyright, deterministic rust bridge generation)"},{"sha":"a76016fd2233424064cc9d5a19aba2b314285aad","date":"2026-09-22","summary":"Database backups stream the export and report failures, Apple releases merge with MusicBrainz by normalized barcode and streaming URLs, and a release can belong to several artists","message":"Database backups stream the export and report failures, Apple releases merge with MusicBrainz by normalized barcode and streaming URLs, and a release can belong to several artists: Worker.run rethrows so a failed task is logged as FAILURE with its message instead of SUCCESS with error=1 (every nightly backup since 2026-09-08 had died silently in the in-memory database export once song_audio_timeline carried BLOBs for 25k songs); DbManagementService writes format v2 row by row (marker -2, per table name plus length-prefixed CBOR rows and a -1 terminator, fetchSize 1000) into a caller-owned stream and imports it in batchInsert chunks of 500, legacy blobs still import, the RPC ByteArray overloads delegate; BackupService streams the export straight into the zip entry, deletes a partial zip on failure and restores from the zip stream; Barcodes normalizes UPC/EAN codes (digits only, leading zeros stripped, padded 12/13/14 variants) for the cached mb_release match, the MusicBrainz barcode search (barcode:(a OR b OR c)) and the merge matcher; MusicBrainzService.fetchReleasesByUrls asks the url endpoint for several resources at once (Apple album URL in the configured storefront plus us/gb/de/fr and the resolver's Spotify/Deezer/Tidal links in canonical form) and resolves the related releases, lookups return null on transport failure so links_resolved_at is only stamped after an answered lookup; AppleMusicReleaseService accepts barcode/URL hits on any tracked group, hands hits on untracked groups credited to the artist to the new ReleaseService.trackReleaseGroup (shares the per-artist context of refreshRecentRelease) and merges afterwards, and processReleaseGroup caches every release of a group so barcodes and release-level relations are available offline; custom migration 3.20 clears links_resolved_at of unmatched rows; release_artist (V1_96, nullable references to recent_release or provider_release plus artist, unique per pair) links every artist a release belongs to: the radar links the processing artist and every credited library artist and, for a group already stored under a collaborator, adds the link in the gate path without HTTP, the Apple upsert keeps the first owner and links each artist whose catalog lists the album, merges copy the provider row's artists onto the group, findUnlinkedAppleRelease is no longer artist scoped, getRecentReleases and getArtistRecentReleases show a release when the owner or any linked artist is followed, cover persistence and the unfollow cleanups use the same rule, artist merges re-point provider releases and link rows to the winner, custom migration 3.21 backfills links for existing rows; RecentRelease.artistIds lists the linked artists (owner first); tests for the streaming export (chunked, binary column, legacy format), the backup zip and failure cleanup, the worker rethrow, barcodes, the MusicBrainz client (mock engine), the Apple matching chain (padded barcode, tracking, URL lookup, resolve stamping, shared album, cross-artist merge), the feed and artist page with linked artists, artist merges and both custom migrations; RPC docs regenerated; common-rpc pointer bump (RecentRelease.artistIds)"},{"sha":"c880c587da609be5059784e9c0bf48e3c7c4e1a6","date":"2026-09-24","summary":"Timecode tags carry a playback action and a fade flag, and songs embed the tags a player has to act on","message":"Timecode tags carry a playback action and a fade flag, and songs embed the tags a player has to act on: TimecodeTagTable gains action and fade columns (V1_97__AddTimecodeTagActions), TimecodeTagService validates that PLAY_ONLY and SKIP sit on chapters with an end position, SKIP_TO and PLAY_UNTIL on markers without one and notes only take NONE in createTag, updateTag and replaceTags, updateTag keeps the stored action and fade when they are left out and validates the resulting values, and RpcTimecodeTagService forwards both; UserSong.playbackTags holds the requesting user's tags with an action, loaded in one batched query per song list in SongService.mapEagerly and never written by song edits; tests for the type and action matrix, the round trip through create, update and replace, kept values on update, the embedded tags per user and song edits leaving tags untouched, the timecode tag table added to the schemas of song query tests; regenerated MODELS, RPC_SERVICES and REST_API docs and REST route goldens; common-rpc pointer bump (TimecodeTagAction, TimecodeTag.action and fade, UserSong.playbackTags)"},{"sha":"68a11a8cfe0efaa6de11f9d74d4e49c5d1ec8269","date":"2026-09-26","summary":"Songs can be super liked on top of a normal like, and super likes weigh more as radio and recommendation seeds","message":"Songs can be super liked on top of a normal like, and super likes weigh more as radio and recommendation seeds: UserSongTable gains a nullable superLikedAt (V1_98__AddSuperLikes), SongService.setLikeLevelReturning sets NONE, LIKE or SUPER, keeps the first superLikedAt on repeated super likes and only moves updatedAt when the liked state flips, setLikedReturning clears a super like on unlike and never downgrades one on like, superLikedSongs and superLikedSongIds list the super liked songs newest first, UserSong carries likeLevel and superLikedAt; ListenService.recentSeedWeights adds SUPER_LIKE_SEED_BONUS for every super liked song and weighs super likes higher in the favourites fallback; LibraryMergeService keeps the earliest superLikedAt when merging songs; tests for the level transitions, the list and flow, the seed weights and the merge; regenerated MODELS, RPC_SERVICES and REST_API docs and REST route goldens; common-rpc pointer bump (LikeLevel, UserSong.likeLevel and superLikedAt, setLikeLevel, superLikedSongs, superLikedSongIds)"},{"sha":"55303d09b9c73c3436ca26f649d9b5034e044a51","date":"2026-09-29","summary":"Songs without a MusicBrainz id are identified by AcoustID fingerprint before the name search, and stored credentials share one encrypted CredentialSource","message":"Songs without a MusicBrainz id are identified by AcoustID fingerprint before the name search, and stored credentials share one encrypted CredentialSource: AcoustIdFingerprintService runs fpcalc -json, AcoustIdService looks the fingerprint up on api.acoustid.org (340 ms per-host delay), keeps results scoring at least 0.85 and picks a single recording or narrows several by title and artist, release group and duration, SongAcoustIdTable caches fingerprint, match and lastCheck (V1_99__AddSongAcoustId) so fpcalc runs once per song and misses are retried after 30 days, SongService.fetchMusicBrainzId tries AcoustID for songs without an id and only falls back to searchMb when it finds nothing; CredentialCipher encrypts stored values with AES-256-GCM (enc:v1: prefix, setting key as AAD, key from CREDENTIALS_ENCRYPTION_KEY or a generated key file under ~/.config/synara), CredentialSource resolves stored then environment credentials, reports STORED, ENVIRONMENT, UNREADABLE or NONE and encrypts on store, PodcastIndexCredentialSource and the new AcoustIdCredentialSource build on it, EncryptStoredCredentials (3.22) encrypts existing plain text values, the Podcast Index and new AcoustID settings pages write through the source and hint at unreadable keys; the Docker images install fpcalc and set ACOUSTID_API_KEY to the Synara key; tests for fingerprint parsing, lookup and selection, the AcoustID path in SongService, the cipher, the source on every dialect, the migration and both settings pages; regenerated ENVIRONMENT_VARIABLES and example.env"},{"sha":"5d6376edc462e71daf1c0a52a8857990d2fa981c","date":"2026-09-30","summary":"Backend refactor from the full audit: song lists page over distinct songs with full pages and correct totals, Postgres search runs without JIT, artist credits keep their order and…","message":"Backend refactor from the full audit: song lists page over distinct songs with full pages and correct totals, Postgres search runs without JIT, artist credits keep their order and join phrases, and a series of bugs found along the way are fixed: the song id query joins only what each filter, sort or search needs, groups by song, applies the explicit filter and duplicate dedupe in SQL before the page cut (title and release date keys mirrored in db/SongTitleKeys.kt and isoDateKey, pinned by SongDuplicateKeyTest) and counts with COUNT(*) OVER () after a cheap existence check, details load through five chunked queries, ties follow defined orders (byArtist releaseDate, album name, album id, disc, track, id; byAlbum disc, track, title, id; otherwise id), Postgres connections set jit=off through the Hikari data source; songArtist and albumArtist gain position and joinPhrase (V1_104__AddArtistCreditOrder, backfill BackfillArtistCreditOrder 3.24 from the MusicBrainz credit cache, also applied at import, unmatched artists after the credited ones in tag order), genres sort by name, the duplicate survivor is the oldest song, originalUrl prefers the matching provider row, byOriginalUrls chunks and resolves one defined winner per URL; the mirror remote-image route requires an admin before the output cache, deleteAlbums returns a correct result and deletes files after commit through LibraryFileDeleter, Tidal and MusicBrainz retries are bounded through a shared retry helper, ISRC and barcode enrichment page by id, post-index tasks run through the managed path and notify dependents, already-running workers are not logged as success, search index items commit one by one and deleted entities leave Redis, Worker.runParallel no longer hangs on a registration race, playlist pages no longer apply the offset twice, album identity at import uses one key, SQLite enforces foreign keys with an orphan cleanup (3.23) and a startup foreign_key_check log, contradictory FK rules and missing delete rules are fixed (V1_100, V1_102), listen and fav sync enums are stored by name (V1_103), 19 indexes on filtered columns (V1_101), the image merge repoints every image reference, the Redis search indexes are created after the cache provider exists; services share a supervised scope and stop in reverse order with a timeout on shutdown, cancellation propagates instead of being swallowed, HTTP clients come from HttpClientFactory, the RPC cache proxy no longer blocks, SearchContext is replaced by RankedSearch, Koin wiring is split into feature modules with a typed ServerConfig, external tools run through ExternalTool, AudioUtils is split into Transcoder, FfmpegProbe and TranscodedSongRepository, file streaming uses chunkFlow, per-user locks and flows evict idle entries, a Dialect helper replaces scattered checks, ItemWorker and @WorkerTask defaults remove worker boilerplate, ImporterState is a Service, test-only seams are gone from production code (tests use mockk and virtual time); the server jar carries only the build host's ffmpeg natives (863 MB to 196 MB), every module builds with the synara.kotlin-jvm convention plugin on JDK 25 and the Docker build stages use gradle:jdk25; tests for every change on both dialects, an opt-in song query equivalence test (-Pequivalence=true), shared test fixtures; regenerated MODELS docs; common-rpc pointer bump (Artist.joinPhrase)"},{"sha":"2a7cd42b01e115f98b5b4fb64c6d58d247a848aa","date":"2026-10-02","summary":"Songs from DJ-mix compilations lose their [Mix Cut] or (Mixed) suffix into a MIX title tag","message":"Songs from DJ-mix compilations lose their [Mix Cut] or (Mixed) suffix into a MIX title tag: ResplitSongTitleTags (3.25) reruns the title split over the library through splitSongTitleTags, which BackfillSongTitleTags (3.17) now shares, keeps the explicit marker and only touches titles that still carry a tag; tests for the re-split and its idempotence on both dialects; regenerated MODELS docs; common-rpc pointer bump (Mix Cut and Mixed MIX tags)"},{"sha":"d0e51f08dc7945c5672351586447376de4ce97e6","date":"2026-10-02","summary":"Song lists filter by title tags and exclude tags directly","message":"Song lists filter by title tags and exclude tags directly: allSongs and allSongIds take excludeTags, titleTags and excludeTitleTags, tags keeps songs matching any tag, excludeTags drops songs matching any tag, the title tag pair works the same over TitleTagKind through SongTable.id in or not in a subquery, all filters combine with AND, invertTags is gone; SongTitleTagTable (V1_105__AddSongTitleTags) keeps one row per song and title tag kind with a cascading songId reference and an index on kind, syncSongTitleTags replaces a song's rows in the same transaction wherever title tags are written (updateSong, createBatch for new and dirty songs, upsertSong, the library merge and the title split migrations), BackfillSongTitleTagTable (3.26) fills it from the stored title tags; tests for every filter alone and combined on both dialects, the sync paths, the cascade and the backfill; regenerated RPC_SERVICES and REST_API docs and REST route goldens; common-rpc pointer bump (excludeTags, titleTags, excludeTitleTags, invertTags removed)"},{"sha":"9bc1c63ddfb893a01a612945716484eda3d09fb6","date":"2026-10-04","summary":"API version 8 with old field names served only by the server and the review's security fixes","message":"API version 8 with old field names served only by the server and the review's security fixes: findUserById, findUserByUsername and createUser no longer hand out password hashes, logins read the hash from the user table and mirrors copy it through getUserPasswordHashes; user playlists and collections can only be changed by their owner or an admin (RpcUserPlaylistService, RpcCollectionService, UnauthorizedException also for cover generation); API keys are stored encrypted with the credential cipher (EncryptApiKeys migration 3.27); importLogin needs the IMPORT capability; songs and albums carry ArtistCredit without the artist bio; renamed fields and the WithSong queue entry go out under their new names, and clients below API version 8 get and send the old names through the server-only LegacyWire layer (core/wire, WireFormats with legacy CBOR for kRPC routes and the reverse proxy and WireJson for REST, a registry for sealed classes guarded by LegacyWireRegistryTest, install(Krpc) replaced by per-route serialization); renamed RPC methods with deprecated delegating old names, deprecations removed with API version 9 as listed in the new DEPRECATIONS.md; unfollowArtistByMusicBrainzId; FeatureDoc texts use @ model references resolved from MODELS.md and RPC_SERVICES.md, generateApiConstantsDocs runs after the docs generation; regenerated docs and hand-written guides (version note, cover ids, renamed methods); common-rpc pointer bump (API version 8)"},{"sha":"a6270fdf7ab330452a9d161c9a34900bbc286f75","date":"2026-10-06","summary":"Editions of an album no longer fold into each other","message":"Editions of an album no longer fold into each other: importing The Divine Feminine (10th Anniversary) skipped Stay because the importer replaced the album tag with the plain MusicBrainz title and the indexer treated the same ISRC on an album of the same name as already present; albums now store a clean name plus edition tags (title_tags column and album_title_tag kind table, V1_106, the album search trigger also watches the tags), split on insert and on updateAlbum, and album matching compares name and tags; the edition comes from the MusicBrainz release disambiguation when it is one and from the provider title otherwise (AlbumEditions, used by the Tidal importer, upcoming releases, YouTube, SoundCloud and split albums); a song counts as present on the same edition when both album barcodes match through Barcodes.same, and without a barcode on one side when name and tags match and the albums are not linked to different MusicBrainz releases; album barcodes are always saved: importers write BARCODE for every import, indexers take the provider album's barcode when the file has none, a matched album without a barcode receives the incoming one, barcode matching ignores length and zero padding, and the Apple Music catalog album returns its UPC; the Tidal indexer asks the provider for the bare album id, so song count, release date and barcode reach it at all; custom migrations 3.28 (fill album barcodes from MusicBrainz and the providers) and 3.29 (split existing album names into name and tags); the merge pass never merges albums with different tags; album tag labels are searchable for albums and for songs through their album; clients below API version 9 get the full album name through AlbumTitleTagsCompat (ALBUM_TITLE_TAGS feature), and Subsonic, scrobbles, MCP, listening stats, LrcLib and the favourites export keep the full name; regenerated docs; common-rpc pointer bump (album tags, API version 9)"},{"sha":"3664e56cbcaa583f1dc01864bf17687da428e170","date":"2026-10-06","summary":"The backend groups albums into editions and picks the main one","message":"The backend groups albums into editions and picks the main one: albums of the same MusicBrainz release group belong together, albums without one join by clean name and album artists (case-insensitive, only with an artist) or by the same cover and attach to a release group they match alone, two release groups never merge (AlbumVersionGroups); the main version is the explicit or the clean edition by the caller's preference when a group has both, decided by the editions' songs, then the one with the fewest edition tags, then the oldest; groups are stored as versionGroupId on the album (V1_107, anchor album, custom migration 3.30 builds them once) and rebuilt single-flight after album inserts, MusicBrainz link changes, updates, merges, splits and deletions including albums removed with their songs; allAlbums and byArtist page over groups and return the main edition with the others in versions, total counts groups, versions(id) reads the stored group main edition first instead of asking MusicBrainz per request, Subsonic and the artist details keep the flat lists; the explicit parameter of both calls is nullable with null preferring the explicit edition, because kRPC does not apply defaults for arguments an older client did not send and fails the call for a missing non-null one, KrpcMissingDefaultArgumentsTest pins that with real calls of released clients on both wire formats and DEPRECATIONS states the rule; clients below API version 9 get one entry per edition through AlbumVersionsCompat (ALBUM_VERSIONS feature), each with its tags back in the name; the two REST routes gain the optional explicit query parameter; regenerated docs; common-rpc pointer bump (album versions)"},{"sha":"dd9796dca025911fa91b61ddadb8d724c785cbfd","date":"2026-10-06","summary":"The server records which entities changed and answers what changed since a time, API version 10","message":"The server records which entities changed and answers what changed since a time, API version 10: every write to songs, albums, artists, playlists, collections and their links is recorded through EntityChangeRecorder in the transaction of the write, per user for likes, album stars, artist follows and timecode tags, as the latest change per entity and aspect (entity_change, user_entity_change and entity_change_scope, V1_108), stamped at commit; EntityChangeService serves the pulls of IEntityChangeService as finite flows read by keyset, with the caller's own per-user rows and, for the filtered pulls, every object a client gets with that artist, album, playlist or collection; changes are kept for ENTITY_CHANGE_RETENTION_DAYS (30) and removed by EntityChangeCleanupWorker, a database restore restarts the tracking; EntityChangeCoverageTest fails for any write on a tracked table that is not classified as recorded, bookkeeping or migration, and custom migrations that change readable data record it too; an album always has a release date: the file tag (year and year-month accepted), the MusicBrainz release, the provider, the earliest song date, and last the day it was added, marked as estimated (V1_109, custom migration 3.32) and replaced once a real source appears, so an album without a date is no longer inserted again on every index run; global playlists keep their ids across index runs and same-named duplicates are removed; merging artists keeps the group with its members and the biography of the main artist, the one whose image was chosen, else the one with the target name, else the first; version groups record every album of a group that gained or lost one; provider links keep the time they were added; V1_109 adds only its own column and FlywayMigrationTest covers the upgrade paths of 1.108 and 1.109; test sources no longer run the docs generators (ksp.allow.all.target.configuration=false, GeneratedDocsTestFixturesTest), so compiling tests cannot change docs; SongService and ArtistService declare all their dependencies at class level; LibraryMergeServiceTest releases its object mock; regenerated docs; common-rpc pointer bump (entity changes, API version 10)"},{"sha":"a8919fc5d2e52989be65ac1ee664d8121758cbb1","date":"2026-10-07","summary":"The schema starts from a frozen base and the server becomes 0.0.2","message":"The schema starts from a frozen base and the server becomes 0.0.2: all 109 Flyway Java migrations and all 52 custom migrations are removed, B1_109__Base.sql per database type (PostgreSQL and SQLite, generated from the schema of a database migrated by the last 0.0.1 build, search triggers and functions unchanged) creates the schema of an empty database, a database upgraded by 0.0.1 keeps its history and continues with the migrations after 1.109, and MigrationBaseCheck refuses at startup every database that is not at the base (older than 1.109, a failed row, tables without history, the custom migrations of 0.0.1 unfinished, a migration this build lacks) with the image ghcr.io/dertyp7214/synara:0.0.1-dev to start once and exit code 1, while a database that holds only an empty history table gets the base; migrations are pairs of generated SQL files from now on (:server:generateMigration, warning for a possible rename and for a required column without default), SchemaDriftTest fails for a table change without a migration and MigrationFilesTest for one-sided files or a Kotlin Flyway class; V1_110 drops the duplicate hue_bridge index on SQLite; backups record the schema version and a restore refuses backups that are too old or newer than the server before anything is touched; the database import runs in one transaction with a single attempt and changes nothing when it fails, no longer exports or imports the search vectors and the search queue (the import of a PostgreSQL export failed on them and left the database empty, the export failed on SQLite) and restarts the change tracking only when it commits; exits during startup use halt, because exitProcess inside the module waits forever for Ktor's shutdown hook, so setup from backup or mirror ends the process again, and the setup no longer runs inside the transaction that held the only SQLite connection; services announce entity changes once through EntityEventPublisher: EntityChangeRecorder records as a subscriber inside the transaction of the write, typed events (EntitiesCreated, EntitiesUpdated, EntityMembersChanged, EntitiesDeleted, EntitiesMerged, LikesChanged, TimecodesChanged, LibraryIndexed) are buffered per transaction, coalesced and delivered after the outermost commit, dropped on rollback; the version group rebuild (one per operation, one second after its last album event, at most five after the first), the duplicate album merge, the post-index tasks and the removal from the Redis search are subscribers bound as HookSubscriber instead of launches placed after writes, albums removed by the createBatch cleanup now leave the Redis search too; plugins get the events through a facade per plugin with declared hook groups (LIBRARY, PLAYLISTS, USER_STATE, PLAYBACK), after commit only and without emitting, plugin API version 4, plugins below 4 keep the four older events without declaring; allArtists and byGroup are ordered by name without regard to case, then by id; SearchIndexWorker starts only on PostgreSQL and the search index rebuild task has nothing to do on SQLite; removed without a caller: AudioProbe.probeChannels, ImageService.purgeNonImageFiles, LibraryMergeService.fixIncorrectMerges, likeAny, ilikeAny and three functions only the custom migrations used; tests drop the PostgreSQL databases and the temporary files they create (TestDatabase tracks them, TestDatabaseCleanupExtension removes what a class left); docker-compose-prod starts PostgreSQL with 1000 connections; docs for updating from 0.0.1, schema changes, hooks and the plugin API; regenerated docs; common-rpc pointer bump (artist list order)"},{"sha":"ae506ec47d7657b0f3991685dd006753c2e97a12","date":"2026-10-10","summary":"User playlists can be shared with single users and made public","message":"User playlists can be shared with single users and made public: a share gives read or write access, a public playlist can be found and opened by everyone, and every other playlist is visible only to its owner and the users it is shared with; existing playlists are private after the upgrade and new ones start private; V1_111 adds userPlaylist.isPublic and the userPlaylistShare table; UserPlaylistService filters lists, search, color search and by-id reads by viewer and gets setPublic, setShare, removeShare, sharedPlaylists and transferOwnership, where the previous owner keeps a write share; RpcUserPlaylistService lets a write share add and remove songs and keeps image, delete, public, shares and transfer for the owner, admins manage a playlist by id but see only their visible ones in lists and search; songs of a user playlist, collection contents and stats, similar songs by playlist and the entity change feed leave out playlists the caller cannot access, deleted rows stay visible; Subsonic lists own, shared and public playlists with the real owner and the public flag and answers 50 for changes without the needed access; playlist backups carry isPublic and shares, restore drops shares of users that no longer exist; IUserService.allProfiles lists every user with name and avatar for all users; tests for the permission table, visibility, shares, transfer, cascades, collections, the change feed and backups, FlywayMigrationTest expects the new table; common-rpc pointer bump"},{"sha":"5bd2d5e468a14190eb4f64721748fd2c915fa230","date":"2026-10-21","summary":"Relink already matched listens (#125): IListeningStatsService.getLinkedListenGroups lists the current user's listens linked to a library song as LinkedListenGroup entries, local…","message":"Relink already matched listens (#125): IListeningStatsService.getLinkedListenGroups lists the current user's listens linked to a library song as LinkedListenGroup entries, local plays grouped by the song that was actually played (ListenTable.playedSongId, null when played and linked song match) and ListenBrainz listens by recording MBID, by MSID when there is no MBID, or as one group without identity, with counts, played ms, last listen, names of the newest listen and whether the group was linked manually; relinkSong moves all groups, or only the given ones, from one song to another: local groups write a ListenSongRedirectTable row from the played song to the target so ListenService.ingestLocal records later plays of that song on the target (relinking back to the played song removes it), ListenBrainz groups replace the ListenLinkTable overrides of every moved MSID and the group's MBID so ingest and rematch follow the new song, groups without identity move without persisting anything, and the moved MSIDs are submitted to ListenBrainz as a manual mapping when the target has a recording MBID; the override replacement of linkUnmatched and the MBID lookup and submit step are shared without behaviour change; playedSongId is a second foreign key from listen to song, so the implicit ListenTable/SongTable joins in ListenService, ListeningStatsService, SubsonicQueryService and ListenHistoryQueryService now name ListenTable.songId; migration V1_112__ListenRelink for both dialects; REST routes GET /listeningStats/linkedListenGroups/{songId} and POST /listeningStats/relinkSong/{fromSongId}; tests: ListenServiceTest (group listing and order, relink one or all groups, local redirect and undo, older MSID override removed, groups without identity persist nothing, validation, change signal), ListenBrainzServiceTest (later listens follow the relink), ListeningStatsServiceTest (manual mapping submitted only for a target with an MBID), FlywayMigrationTest expects the new table; routes.golden, routes.openapi.golden, MODELS.md, RPC_SERVICES.md and REST_API.md regenerated; common-rpc pointer bump"},{"sha":"ba17dedf70f20e317ff242123e2435ac8c0c4dc7","date":"2026-10-21","summary":"Shared listen history: an admin can link two accounts mutually, and two users linked to the same ListenBrainz account can connect themselves, so each reads the other's listens in…","message":"Shared listen history: an admin can link two accounts mutually, and two users linked to the same ListenBrainz account can connect themselves, so each reads the other's listens in stats and history while every listen is still recorded for the user who played it; ListenShareTable stores one row per pair (userA \u003c userB, both references to UserTable, cascade on delete) with useForRecommendations per link, migration V1_113__ListenShare for both dialects; ListenShareService links, unlinks and toggles the option (admin or either member, connecting needs admin or a shared ListenBrainz account, links survive ListenBrainz changes) and lists links and candidates; listenOwnerPredicate takes an explicit ListenScope: SHARED for recent listens, artists and albums, ListeningStatsService.runPass, the MCP history queries and Subsonic FREQUENT/RECENT (which now also count the user's own ListenBrainz listens), OWN for linked groups, relink and linkUnmatched, RECOMMENDATIONS for the listen part of recentSeedWeights so the mix and history radios include a partner only when the link's option is on; listensChanged also notifies partners; the MCP instructions mention linked accounts; server UI pages listenShare.settings (SETTINGS slot) and listenShare.admin (admin dashboard slot) manage links, the admin page picks users with the new SearchField; UiComponent.SearchField with IUiService.search (POST /ui/search/{contributionId}) and UiContribution.search, UI schema version 3; older clients get a query TextField, a search button and a Select of results from UiSchemaCompat, which now receives a CompatScope with the user, contribution and context of the call, and the legacy search submit is answered in the compat layer with OpenPage carrying the query; ResponseShaper is suspend and gets the user from RPC and REST calls; tests: ListenShareServiceTest, ListenShareContributionsTest, ListenServiceTest, ListeningStatsServiceTest, ListeningStatsTopSongsTest, ListenHistoryQueryServiceTest, SubsonicQueryServiceTest, UiSchemaCompatTest, UiServiceTest, UiSerializationTest, ClientCompatTest, FlywayMigrationTest expects the new table; routes.golden, routes.openapi.golden, API_CONSTANTS.md, MODELS.md, RPC_SERVICES.md and REST_API.md regenerated; common-rpc pointer bump"},{"sha":"ace5acf1395ba709764db682580afa135150c95a","date":"2026-10-22","summary":"Lyrics candidates from online providers (#126)","message":"Lyrics candidates from online providers (#126): ILyricsCandidateService (RPC and generated REST under /lyricsCandidate) serves the default lyrics of a song, every stored candidate with its rank, lookups for a song or any track, hand-timed lyrics, LRC, TTML and Lyricsfile imports, an admin pin of the default and a stream of candidates as providers answer; providers Better Lyrics, Unison, LyricsPlus, KuGou, LRCLIB (with /api/search) and YouTube Music plus .lyricsfile.yaml, .ttml and .lrc sidecars, configured in order through LYRICS_PROVIDERS, 401/403/404/410 count as a miss, cross-host redirects are refused, bodies are capped at 512 KiB and the provider hosts are queued 2 s apart (lrclib.net keeps 250 ms); TTML, enhanced LRC, KRC, LyricsPlus and Lyricsfile parsers produce SyncedLyrics whose word texts spell the line text exactly, so syllables, backing vocals and duet voices fit, with HTML stripping, limits, all-or-nothing word timing per line and a track match on title, artist and an 8 s duration gap; LyricsCandidateService stores every answer in lyrics_candidate (enum status, sync level and match columns, plain text with a GIN full-text index on postgres, migration V1_114 for both dialects) and song.preferred_lyrics_candidate, ranks manual, sidecar, then word over line over plain, verified over provider-only, configured priority and duration gap, lists the song's own lyrics and the WhisperX result as virtual candidates, retries misses and line-synced answers after 14 days and never stores errors; songs carry lyricsInfo for clients from API version 11 (ClientFeature.LYRICS_SERVICE) and older clients still get lyrics: LegacyWire writes encode-only extra fields declared with LegacyWireField, wireFor caches one wire per active rule set, LegacyLyricsCompat prefetches the lyrics of every song in a response into LegacyLyricsCache in one query and clears lyricsInfo; updateSong no longer writes lyrics, setLyrics stays; searchByLyrics also searches candidate text; SongTag HAS_SYNCED_LYRICS and HAS_WORD_SYNCED_LYRICS filter; Subsonic getLyricsBySongId serves the default candidate; mirror sync fetches the remote song lyrics through the new service; LyricsProviderWorker runs nightly and LyricsSyncWorker skips songs with word-synced candidates; createBatch keeps storing InsertableSong lyrics; tests: parser, provider, candidate service, wire (JSON, CBOR, kRPC and REST for versions 7, 10 and 11), SongService lyricsInfo and tag filters, Subsonic, mirror and worker tests, FlywayMigrationTest expects the new table and index; routes.golden, routes.openapi.golden, API_CONSTANTS.md, MODELS.md, RPC_SERVICES.md, REST_API.md, PERMISSIONS.md, ENVIRONMENT_VARIABLES.md and example.env regenerated, API_VERSIONING.md, DEPRECATIONS.md and DEVELOPMENT.md updated; common-rpc pointer bump"},{"sha":"19279b1a759442d78d650371c7fb32d8276dde99","date":"2026-10-29","summary":"Masked words in lyrics (****, n***a, mother****er, f--k, [__]) are restored from the other candidates of the song","message":"Masked words in lyrics (****, n***a, mother****er, f--k, [__]) are restored from the other candidates of the song: LyricsUncensor aligns the tokens of both versions globally (line starts at most 5 s apart when both are timed) and restores a masked word only when the donor word fits its visible letters and every unmasked neighbour within the line matches; the result is stored as the uncensored candidate whose source_candidate points at the censored row, ranks directly above it and takes over a pin on the source when it is created; manual and sidecar candidates are never rewritten; the UncensorLyricsCandidates custom migration builds it for stored candidates and logs to the task logs"},{"sha":"2737b456665446b24dc162de7ad2e0beedaf2028","date":"2026-10-29","summary":"Masked lyrics: words are compared without leading or trailing apostrophes, so 'cause next to a mask anchors on a donor's cause","message":"Masked lyrics: words are compared without leading or trailing apostrophes, so 'cause next to a mask anchors on a donor's cause; the backfill reports progress from 0 to 100 and is renamed to RestoreMaskedLyrics so servers that already ran it restore the remaining masks once more"},{"sha":"b7ef79cc7febe944e30f688607ac60e0adeff4e4","date":"2026-10-29","summary":"Masked lyrics: common spelling variants count as equal when matching (tryna = trying to, ya = you, 'cause = because, gonna, wanna, gotta and others, multi-word expansions never…","message":"Masked lyrics: common spelling variants count as equal when matching (tryna = trying to, ya = you, 'cause = because, gonna, wanna, gotta and others, multi-word expansions never fill half a mask), a dropped g matches (nothin' = nothing), and a mask prefers the donor word of its own length so a trailing ad-lib no longer takes it; the backfill is renamed to RestoreMaskedLyricsWithAliases so servers restore the remaining masks once more"}],"milestones":[{"id":"flyway","commit":0,"title":"Flyway introduced","text":"The schema is versioned by Flyway, starting with V1_0 InitialSchema."},{"id":"custom","commit":13,"title":"Custom migrations introduced","text":"Data migrations written in Kotlin get their own version sequence and are recorded by class name once they ran. The first is 1.0 TagMusicBrainzIds."},{"id":"base","commit":113,"title":"Base frozen","text":"109 Flyway migrations and 52 custom migrations are folded into B1_109__Base.sql, which creates the schema of an empty database at version 1.109. An older database first runs the image ghcr.io/dertyp7214/synara:0.0.1-dev until the custom migration FillAlbumReleaseDates is recorded, then updates past the base.","steppingStone":"ghcr.io/dertyp7214/synara:0.0.1-dev","lastCustom":"FillAlbumReleaseDates"}],"base":{"file":"server/src/main/kotlin/dev/dertyp/db/MigrationBase.kt","version":"1.109","lastCustom":"FillAlbumReleaseDates","steppingStone":"ghcr.io/dertyp7214/synara:0.0.1-dev"},"web":"https://github.com/DerTyp7214/synara-api","head":{"sha":"691cd62d847c28b0518629305cc1f03da13aea09","date":"2026-10-30"},"title":"Synara"}</script>
<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('data').textContent);
const E = D.entries, C = D.commits;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const nf = new Intl.NumberFormat('en-US');
const fmt = n => nf.format(n);
const fmtDay = iso => { const [y, m, d] = iso.split('-').map(Number); return d + ' ' + MON[m - 1] + ' ' + y; };

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null) e.append(kid);
  return e;
}

/* commit references link to the web view of the origin remote when it could be read */
const commitRef = i => {
  const c = C[i], short = c.sha.slice(0, 8);
  return D.web ? h('a', { class: 'mono', href: D.web + '/commit/' + c.sha, target: '_blank', rel: 'noopener', text: short })
    : h('span', { class: 'mono', text: short });
};
const at = i => [' in ', commitRef(i), ' (' + fmtDay(C[i].date) + ')'];

const KINDS = [['flyway', 'Flyway', 'var(--s0)'], ['custom', 'Custom', 'var(--s1)'], ['base', 'Base', 'var(--s2)']];
const STATES = [['current', 'Current'], ['folded', 'Folded into base'], ['removed', 'Removed']];
const stateOf = e => e.status === 'renamed' ? 'removed' : e.status;
const STATUS_TEXT = { current: 'current', folded: 'folded into base', removed: 'removed', renamed: 'renamed' };
const flywayName = (key, name) => key + '__' + name;

/* ---------- header figures ---------- */
const count = (kind, st) => E.filter(e => e.kind === kind && (!st || stateOf(e) === st)).length;
const fly = count('flyway'), cus = count('custom');
const cur = E.filter(e => e.kind !== 'base' && e.status === 'current').length;
const fold = E.filter(e => e.status === 'folded').length;
const first = C[0], last = C[C.length - 1];
document.getElementById('lede').textContent =
  `Every Flyway and custom database migration from ${fmtDay(first.date)} to ${fmtDay(last.date)}, read from ${fmt(C.length)} commits of the git history. ` +
  `Each entry shows the commit that added it, the tables it touches and what became of it.`;
const stats = document.getElementById('stats');
[
  [fmt(fly), 'Flyway migrations', `${count('flyway', 'current')} current, ${count('flyway', 'folded')} folded, ${count('flyway', 'removed')} removed`],
  [fmt(cus), 'Custom migrations', `${count('custom', 'current')} current, ${count('custom', 'folded')} folded, ${count('custom', 'removed')} removed or renamed`],
  [fmt(cur), 'Shipped today', 'Flyway and custom migrations still in the code' + (D.base.version ? `, base ${D.base.version}` : '')],
  [fmt(fold), 'Folded into the base', E.some(e => e.kind === 'base') ? 'Replaced by ' + E.filter(e => e.kind === 'base').map(e => flywayName(e.key, e.name) + '.sql').join(', ') : 'No base yet'],
].forEach(([v, l, s]) => stats.append(h('div', { class: 'stat' }, h('div', { class: 'v', text: v }), h('div', { class: 'l', text: l }), h('div', { class: 's', text: s }))));

/* ---------- filters ---------- */
const on = { flyway: true, custom: true, base: true, current: true, folded: true, removed: true };
function chip(parent, key, label, color, n) {
  const b = h('button', { type: 'button', 'aria-pressed': 'true', onclick: () => { on[key] = !on[key]; b.setAttribute('aria-pressed', on[key]); apply(); } },
    color ? h('i', { class: 'dot', style: 'background:' + color }) : null, label, h('span', { class: 'n', text: fmt(n) }));
  parent.append(b);
}
KINDS.forEach(([k, l, c]) => chip(document.getElementById('kinds'), k, l, c, E.filter(e => e.kind === k).length));
STATES.forEach(([k, l]) => chip(document.getElementById('states'), k, l, null, E.filter(e => stateOf(e) === k).length));

/* ---------- entries ---------- */
function notes(e) {
  const out = [];
  if (e.names) out.push(['First added as ' + flywayName(e.key, e.names[0]) + ', the name changed later']);
  if (e.renamedFrom) {
    const [key, name, c] = e.renamedFrom;
    out.push(e.kind === 'custom'
      ? ['Renamed from ' + key, ...at(c), ': ', h('span', { class: 'again', text: 'runs again on servers' }), ', because a custom migration is recorded by its class name']
      : ['Takes over the content of ' + flywayName(key, name), ...at(c)]);
  }
  for (const [c, text] of e.events || []) out.push([text, ...at(c)]);
  if (e.status === 'folded') out.push(['Folded into the base', ...at(e.gone)]);
  else if (e.status === 'renamed') out.push(['Renamed to ' + e.renamedTo[0], ...at(e.gone)]);
  else if (e.status === 'removed' && e.renamedTo) out.push(['Merged into ' + flywayName(e.renamedTo[0], e.renamedTo[1]), ...at(e.gone)]);
  else if (e.status === 'removed') out.push(['Removed', ...at(e.gone)]);
  return out.length ? h('ul', { class: 'notes' }, out.map(n => h('li', null, n))) : null;
}
const TABLES_SHOWN = 14;
function tables(list) {
  if (!list.length) return null;
  const box = h('div', { class: 'tables', 'aria-label': 'Tables' });
  const fill = all => { box.replaceChildren(...(all ? list : list.slice(0, TABLES_SHOWN)).map(t => h('code', { text: t })));
    if (!all && list.length > TABLES_SHOWN) box.append(h('button', { type: 'button', text: `+${list.length - TABLES_SHOWN} more`, onclick: () => fill(true) })); };
  fill(false);
  return box;
}
function commitText(i) {
  const c = C[i];
  return [
    h('p', { class: 'subj', text: c.summary }),
    c.message.length > c.summary.length ? h('details', null, h('summary', { text: 'Full commit message' }), h('pre', { text: c.message })) : null,
  ];
}
function entryNode(e) {
  const sql = e.files.length ? e.files.join(' + ') + ' SQL' : e.kind === 'custom' ? 'Kotlin, custom' : 'Kotlin';
  const title = e.kind === 'custom'
    ? [h('span', { class: 'ver', text: e.version }), h('span', { class: 'nm', text: e.label }), h('code', { class: 'cls', text: e.key })]
    : [h('span', { class: 'ver', text: e.key }), h('span', { class: 'nm', text: e.name })];
  const li = h('li', { class: 'k-' + e.kind + (e.status === 'current' ? '' : ' gone') },
    h('div', { class: 'head' }, title, h('span', { class: 'pill st-' + e.status, text: STATUS_TEXT[e.status] })),
    h('div', { class: 'meta' }, fmtDay(C[e.added].date) + ' · ', commitRef(e.added), ' · ' + sql + (e.tables.length ? ' · ' + e.tables.length + (e.tables.length === 1 ? ' table' : ' tables') : '')),
    notes(e), tables(e.tables), commitText(e.added));
  li._e = e;
  li._hay = [e.key, e.version, e.name, e.label, ...(e.names || []), ...e.tables, C[e.added].message.split('\n')[0]].filter(Boolean).join('\n').toLowerCase();
  return li;
}
function milestoneNode(m) {
  const li = h('li', { class: 'ms' },
    h('div', { class: 'mt', text: m.title }),
    h('div', { class: 'meta' }, fmtDay(C[m.commit].date) + ' · ', commitRef(m.commit)),
    h('p', { class: 'mx', text: m.text }), commitText(m.commit));
  li._hay = (m.title + '\n' + m.text + '\n' + C[m.commit].message.split('\n')[0]).toLowerCase();
  return li;
}

/* items in history order: a commit's milestones come before the migrations it added */
const items = [];
D.milestones.forEach(m => items.push({ c: m.commit, ms: 1, node: milestoneNode(m) }));
E.forEach(e => items.push({ c: e.added, ms: 0, node: entryNode(e) }));
items.forEach((it, i) => it.i = i);
items.sort((a, b) => a.c - b.c || b.ms - a.ms || a.i - b.i);

let newestFirst = true;
const root = document.getElementById('tl');
function build() {
  const ordered = newestFirst ? [...items].reverse() : items;
  const months = [];
  for (const it of ordered) {
    const ym = C[it.c].date.slice(0, 7);
    if (!months.length || months[months.length - 1].ym !== ym) months.push({ ym, items: [] });
    months[months.length - 1].items.push(it);
  }
  root.replaceChildren(...months.map(mo => {
    const [y, m] = mo.ym.split('-').map(Number);
    const n = h('small');
    const sec = h('section', { class: 'month' }, h('h2', null, MONF[m - 1] + ' ' + y, n), h('ol', { class: 'tl' }, mo.items.map(it => it.node)));
    sec._n = n;
    return sec;
  }));
  document.getElementById('order').textContent = newestFirst ? 'Oldest first' : 'Newest first';
  apply();
}
const q = document.getElementById('q');
function apply() {
  const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  for (const it of items) {
    const e = it.node._e;
    const match = terms.every(t => it.node._hay.includes(t));
    const vis = e ? on[e.kind] && on[stateOf(e)] && match : match;
    it.node.hidden = !vis;
    if (vis && e) shown++;
  }
  for (const sec of root.children) {
    const visible = [...sec.querySelectorAll('.tl > li')].filter(li => !li.hidden);
    sec.hidden = !visible.length;
    const n = visible.filter(li => li._e).length;
    sec._n.textContent = n ? (n === 1 ? '1 migration' : n + ' migrations') : '';
  }
  document.getElementById('count').textContent = shown === E.length ? fmt(E.length) + ' migrations' : fmt(shown) + ' of ' + fmt(E.length);
  document.getElementById('empty').hidden = shown > 0 || [...root.children].some(s => !s.hidden);
}
q.addEventListener('input', apply);
document.getElementById('order').addEventListener('click', () => { newestFirst = !newestFirst; build(); });

/* theme: follows the system unless the reader picks one */
const themeBtn = document.getElementById('theme'), MODES = ['auto', 'light', 'dark'];
let mode = 'auto';
function setTheme(mo, save) {
  mode = mo;
  if (mo === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', mo);
  themeBtn.textContent = 'Theme: ' + mo;
  if (save) try { localStorage.setItem('migration-timeline-theme', mo); } catch (e) {}
}
themeBtn.addEventListener('click', () => setTheme(MODES[(MODES.indexOf(mode) + 1) % 3], true));
const params = new URLSearchParams(location.hash.slice(1));
let saved = null; try { saved = localStorage.getItem('migration-timeline-theme'); } catch (e) {}
setTheme(MODES.includes(params.get('theme')) ? params.get('theme') : MODES.includes(saved) ? saved : 'auto');
if (params.get('q')) q.value = params.get('q');

const foot = document.getElementById('foot');
[
  `Flyway migrations are the files named V<version>__<Name> (Kotlin Java migrations, later SQL files with one PostgreSQL and one SQLite variant counted as one migration) and the frozen base B<version>__Base.sql. Renamed and moved files are followed through the history, so a package move is not a new migration. Custom migrations are the classes in the migrations/custom package, with the @Migration version and the logTask label of the commit that added them (the label of a later commit when the first had none, otherwise the class name split into words).`,
  `A custom migration is recorded by its class name once it ran, so a renamed class runs again on every server. Folded means the migration was deleted in the commit that added the base, whose schema already contains its result. Tables come from CREATE, ALTER and DROP TABLE and CREATE INDEX statements and from Kotlin table objects, named by their SQL table name where the object still exists.`,
  (D.base.steppingStone ? `MigrationBase at HEAD: schema base ${D.base.version}, last custom migration of the old line ${D.base.lastCustom}, stepping stone image ${D.base.steppingStone}. ` : '') +
  `Data as of commit ${D.head.sha.slice(0, 8)} on ${fmtDay(D.head.date)}. Regenerate with python3 scripts/migration-timeline.py.`,
].forEach(t => foot.append(h('p', { text: t })));

build();
})();
</script>
