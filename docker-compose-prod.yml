services:
  api:
    image: ghcr.io/dertyp7214/synara:latest-dev
    user: "1000:1000"
    network_mode: host
    env_file:
      - .server.env
    environment:
      - PORT=8081
      - HOST_UID=1000
      - HOST_GID=1000
      - DB_URL=jdbc:postgresql://127.0.0.1:5432/synara-api-db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_DRIVER=org.postgresql.Driver
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=7000
      - BACKUP_DIR=/backups
      - TRANSCRIBER_URL=http://127.0.0.1:8000
      - AUDIO_EMBED_URL=http://127.0.0.1:8200
      - RECSYS_DATA_DIR=/recsys
    volumes:
      - /home/typ/Music:/data
      - tiddl:/home/appuser/.tiddl
      - config:/home/appuser/.config
      - backups:/backups
      - recsys_data:/recsys
    depends_on:
      db:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 5G
  db:
    image: postgres
    user: "1000:1000"
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: synara-api-db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 30s
      start_interval: 1s
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
  redis-cluster:
    image: ghcr.io/dertyp7214/synara-redis-cluster:latest-dev
    environment:
      - NODES=6
      - REPLICAS=0
      - PORT_START=7000
      - HOST=127.0.0.1
      - MAXMEMORY=2gb
      - MAXMEMORY_POLICY=allkeys-lfu
    ports:
      - "7000-7010:7000-7010"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 cluster info | grep -E 'cluster_state:ok|cluster_slots_assigned:16384' | wc -l | grep '2'"]
      interval: 10s
      start_interval: 1s
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 13G

  transcriber:
    image: ghcr.io/dertyp7214/synara-transcriber:latest-dev
    ports:
      - "8000:8000"
    volumes:
      - /home/typ/Music:/data
      - transcriber_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  audio-embed:
    image: ghcr.io/dertyp7214/synara-audio-embed:latest-dev
    ports:
      - "8200:8200"
    volumes:
      - /home/typ/Music:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/health"]
      interval: 30s
      start_interval: 2s
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  recsys:
    image: ghcr.io/dertyp7214/synara-recsys:latest-dev
    volumes:
      - recsys_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  tiddl:
  config:
  postgres:
  redis_data:
  backups:
  transcriber_cache:
  recsys_data: