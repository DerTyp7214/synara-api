services:
  api:
    depends_on:
      db:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
    environment:
      CLIENT_ID: test-id
      CLIENT_SECRET: test-secret
      DB_DRIVER: org.postgresql.Driver
      DB_PASSWORD: password
      DB_URL: jdbc:postgresql://127.0.0.1:6432/synara-api-db
      DB_USER: postgres
      HOST_GID: '1000'
      HOST_UID: '1000'
      JWT_AUDIENCE: synara-api
      JWT_ISSUER: synara
      JWT_REALM: Access to 'Synara-API'
      JWT_SECRET: some-secret
      PORT: '8081'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '7000'
      BACKUP_DIR: /backups
      TRANSCRIBER_URL: http://127.0.0.1:8000
      AUDIO_EMBED_URL: http://127.0.0.1:8200
      RECSYS_DATA_DIR: /recsys
    image: ghcr.io/dertyp7214/synara:latest-dev
    network_mode: host
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    user: '1000:1000'
    volumes:
      - bind:
          create_host_path: False
          propagation: rprivate
        read_only: False
        source: /mnt/External/Synara
        target: /data
        type: bind
      - read_only: False
        source: tiddl
        target: /home/appuser/.tiddl
        type: volume
      - read_only: False
        source: config
        target: /home/appuser/.config
        type: volume
      - read_only: False
        source: backups
        target: /backups
        type: volume
      - read_only: False
        source: recsys_data
        target: /recsys
        type: volume

  db:
    environment:
      POSTGRES_DB: synara-api-db
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >-
      -N 1000
    shm_size: '1gb'
    healthcheck:
      interval: 30s
      start_interval: 1s
      start_period: 15s
      test:
        - CMD-SHELL
        - pg_isready -U postgres
    image: postgres
    platform: linux/amd64
    ports:
      - '6432:5432'
    pull_policy: missing
    restart: unless-stopped
    user: '1000:1000'
    volumes:
      - read_only: False
        source: postgres
        target: /var/lib/postgresql
        type: volume

  redis-cluster:
    environment:
      NODES: 6
      REPLICAS: 0
      PORT_START: 7000
      HOST: 127.0.0.1
      MAXMEMORY: 2gb
      MAXMEMORY_POLICY: allkeys-lfu
    healthcheck:
      interval: 10s
      start_interval: 1s
      start_period: 15s
      test:
        - CMD-SHELL
        - redis-cli -p 7000 cluster info | grep -E 'cluster_state:ok|cluster_slots_assigned:16384' | wc -l | grep '2'
    image: ghcr.io/dertyp7214/synara-redis-cluster:latest-dev
    platform: linux/amd64
    ports:
      - "7000-7010:7000-7010"
    pull_policy: missing
    restart: unless-stopped
    volumes:
      - read_only: False
        source: redis_cluster_data
        target: /data
        type: volume

  transcriber:
    image: ghcr.io/dertyp7214/synara-transcriber:latest-dev
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    ports:
      - '8000:8000'
    volumes:
      - bind:
          create_host_path: False
          propagation: rprivate
        read_only: False
        source: /mnt/External/Synara
        target: /data
        type: bind
      - read_only: False
        source: transcriber_cache
        target: /root/.cache
        type: volume
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  audio-embed:
    image: ghcr.io/dertyp7214/synara-audio-embed:latest-dev
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    ports:
      - '8200:8200'
    healthcheck:
      interval: 30s
      start_interval: 2s
      start_period: 30s
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8200/health
    volumes:
      - bind:
          create_host_path: False
          propagation: rprivate
        read_only: True
        source: /mnt/External/Synara
        target: /data
        type: bind

  recsys:
    image: ghcr.io/dertyp7214/synara-recsys:latest-dev
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    volumes:
      - read_only: False
        source: recsys_data
        target: /data
        type: volume

volumes:
  tiddl: {}
  config: {}
  postgres: {}
  redis_cluster_data: {}
  backups: {}
  transcriber_cache: {}
  recsys_data: {}

x-portals:
  - host: 0.0.0.0
    name: API Stats
    path: /stats
    port: 8081
    scheme: http
