ktor:
    application:
        modules:
            - dev.dertyp.ApplicationKt.module
    deployment:
        port: $PORT:8080
client:
  id: ${CLIENT_ID}
  secret: ${CLIENT_SECRET}
backup:
  dir: ${BACKUP_DIR:}
redis:
  host: ${REDIS_HOST:}
  port: ${REDIS_PORT:}
imageCache:
  url: ${IMAGE_CACHE_URL:}
  token: ${IMAGE_CACHE_TOKEN:}
jwt:
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  realm: ${JWT_REALM}
  secret: ${JWT_SECRET}
storage:
  driverClassName: ${DB_DRIVER}
  jdbcURL: ${DB_URL}
  user: ${DB_USER:}
  password: ${DB_PASSWORD:}
audio:
  tracks: ${AUDIO_TRACKS_PATH}
  albums: ${AUDIO_ALBUMS_PATH}
  playlists: ${AUDIO_PLAYLISTS_PATH}
  transcode: ${AUDIO_TRANSCODE_PATH}
  autoTranscode: ${AUDIO_AUTO_TRANSCODE_QUALITIES:}
  custom: ${AUDIO_CUSTOM_PATH}
  secondary-tracks:
    - ${AUDIO_TRACKS_SECONDARY_PATH:}
transcriber:
  url: ${TRANSCRIBER_URL:http://localhost:8000}
data:
  images: ${DATA_IMAGES_PATH}
spotify:
  clientId: ${SPOTIFY_CLIENT_ID}
  clientSecret: ${SPOTIFY_CLIENT_SECRET}
tidal:
  clientId: ${TIDAL_CLIENT_ID}
  clientSecret: ${TIDAL_CLIENT_SECRET}
proxy:
  hostname: ${PROXY_HOSTNAME:}
  controlPort: ${PROXY_CONTROL_PORT:8081}
  ssl: ${PROXY_SSL:false}
  name: ${PROXY_NAME:}
  id: ${PROXY_ID:}
  key: ${PROXY_KEY:}
